          nullable: true
          source_type: java.util.Date；前端HandoverRecordVO声明string，展示组件另兼容对象time字段。
          compatibility: 保留接口原值；若返回数值或对象time，仅在时间单位与时区明确时转换。无法确定则原样展示并标注待核实，不猜秒/毫秒。
        handover_source_type_code:
          path: $.data.handover.records[*].authorizationSourceTypeCode
          type: integer
          nullable: true
          meaning: 授权来源类型；保留真实code，不能把任意授权记录直接称为一次本次交接。
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
    history_interpretation:
      employee_object: 三类人员均为EmployeeVO对象；employeeId为内部ID十进制字符串，name为姓名，displayName为展示名，tenantId为内部租户ID字符串。用ID判定是否同人，展示优先displayName再name，不能通过同名合并。
      current_roles: 创建人取createEmployee、当前归属人取ownerEmployee、当前申请人取submitterEmployee；任何一项为空就报告为空，不从创建人或历史记录推补。
      record_shape: records在已核源码中为扁平HandoverRecordVO数组；逐条以同一record索引关联前人、后人、操作人、时间和来源。出现多条或同时间多人记录时保留分组及每条对应关系，不压成一条，也不拼接不同记录的字段；若实际出现嵌套数组等结构漂移则停止推断并报告。
      null_handling: handover/records为空只说明本接口未返回可用历史，不证明从未交接；前人或操作人对象可能因缺ID/缺员工映射为空，保持未知，不能互相替代。空record跳过并报告数量，不能虚构人员。
      source_codes: 已核授权来源：0=DEFAULT，1=OPEN_PLATFORM，2=MANUAL_HANDOVER，3=DIMISSION_HANDOVER；其他或未知code保留原码并标注来源待核实，不猜类型。
      ordering_and_time: 保存原始顺序与时间；需要排序时只能使用可解释的createTime。显示北京时间时明确Asia/Shanghai，缺时区/时间格式不明则保留原文，不隐式假定UTC。
      write_evidence_boundary: 历史查询仅回答已返回的交接历史；现存记录、当前归属人等于接收人、历史交接双方相符，都不能证明本次写入成功。写后仍需按result_policy匹配本次返回授权、写前不存在的新记录以及逐份回读。
    notes:
    - 当前Drawer另有 composition/contractAndTask；该聚合入口包含交易方状态更新，未选为本配方。/contract/info 是现存受权详情接口，test 只读调用已有成功证据，交接写后的回查仍待验证。
    - generateContractName=false，tianyancha=false；未承诺所有详情内部逻辑零副作用。
    - assemblyId/previousId/nextId 空或0均不能证明 groupId 下没有其他有效资源/关联草稿。
    - 本配方适用的普通处理资源仍须通过详情权限；已确认组成员采用父组受权childrenInfo读取有保障字段，不以普通info系统错误推断权限被拒。
    - H21a只读验证中，两个type11组成员调用本路径分别返回110002系统错误；未查明异常根因，不归因为缺参数、无权限或类型必然不支持，不通过猜参数/改身份/改用composition重试。 该历史读取现象不列为Skill待修复项或组交接阻塞；已确认组成员不再强制走此路径。
    resource_scope:
      handler: ContractHandover
      exclude_confirmed_assembly_members: true
      assembly_member_read_recipe: verify_assembly_children
      dispatch_rule: 按本次已核处理器分流；由ContractAssemblyHandover更新的组内成员不强制经普通contract/info。类型或归属处理器未确证时先停在识别步骤，不能借此放行未知资源。
    execute_when: 本次由ContractHandover处理的资源；不含已确认由父组处理器更新的组内成员
  verify_assembly_detail:
    purpose: 回读本次影响的合同组本体，核对组专用角色变更及本次交接记录
    role: VERIFY
    required: true
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/contractAssembly/info
      open_web_path: /open-web/web/clm/contractAssembly/info
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters:
      contractAssemblyId:
        location: QUERY
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: steps.execute_batch.expected_affected_resources.assembly_id
        transform: 遍历本次预检证明的全部受影响assembly内部ID
      batchContractChildrenPageIndex:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: 0
      batchContractChildrenPageSize:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: 100
      needChildrenInfo:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        assembly_id:
          path: $.data.contractAssemblyId
          type: string
          nullable: false
        name:
          path: $.data.contractAssemblyName
          type: string
          nullable: true
        business_type_code:
          path: $.data.businessTypeCode
          type: integer
          nullable: false
        status_code:
          path: $.data.contractStatusCode
          type: integer
          nullable: false
        group_id:
          path: $.data.groupId
          type: string
          nullable: true
        previous_id:
          path: $.data.previousId
          type: string
          nullable: true
        next_id:
          path: $.data.nextId
          type: string
          nullable: true
        owner_id:
          path: $.data.ownerEmployee.employeeId
          type: string
          nullable: true
        submitter_id:
          path: $.data.submitterEmployee.employeeId
          type: string
          nullable: true
        department_id:
          path: $.data.department.departmentId
          type: string
          nullable: true
        children_count:
          path: $.data.childrenCount
          type: integer
          nullable: true
        contracts:
          path: $.data.contracts
          type: array
          nullable: true
        handover_records:
          path: $.data.handover.records
          type: array
          nullable: true
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
    notes:
    - needChildrenInfo=false 对非batch组仍可能返回首批子合同；不得把 contracts 长度当全部。
    - childrenCount 由当前 tenantId+assemblyId+valid=true 实时计数；不是同groupId全部assembly版本数量。
    - Controller数据权限businessTypeCodeKey固定10；type17真实网关与权限表现待运行验证。
  verify_assembly_children:
    purpose: 按父组权限回读全部成员的身份、当前角色和需求人，结合本次父组授权与完整成员关系核对交接结果；部门不列判据
    role: VERIFY
    required: true
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/contractAssembly/childrenInfo
      open_web_path: /open-web/web/clm/contractAssembly/childrenInfo
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters:
      contractAssemblyId:
        location: QUERY
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: steps.execute_batch.expected_affected_resources.assembly_id
        transform: 逐个已证明的受影响assembly分页
      batchContractChildrenPageIndex:
        location: QUERY
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: steps.verify_assembly_children.page_index
        transform: 从0逐页读取至空，与写前及写后childrenCount复核
      batchContractChildrenPageSize:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: 100
      needApproveRecord:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        contracts:
          path: $.data.contracts
          type: array
          nullable: false
        contract_ids:
          path: $.data.contracts[*].contractId
          type: array
          nullable: false
        tenant_ids:
          path: $.data.contracts[*].tenantId
          type: array
          nullable: true
        assembly_ids:
          path: $.data.contracts[*].assemblyId
          type: array
          nullable: true
        group_ids:
          path: $.data.contracts[*].groupId
          type: array
          nullable: true
        business_type_codes:
          path: $.data.contracts[*].businessTypeCode
          type: array
          nullable: true
        contract_numbers:
          path: $.data.contracts[*].contractNumber
          type: array
          nullable: true
        contract_names:
          path: $.data.contracts[*].contractName
          type: array
          nullable: true
        status_codes:
          path: $.data.contracts[*].contractStatusCode
          type: array
          nullable: true
        status_names:
          path: $.data.contracts[*].contractStatusName
          type: array
          nullable: true
        previous_ids:
          path: $.data.contracts[*].previousId
          type: array
          nullable: true
        next_ids:
          path: $.data.contracts[*].nextId
          type: array
          nullable: true
        owner_ids:
          path: $.data.contracts[*].ownerEmployee.employeeId
          type: array
          nullable: true
        owner_names:
          path: $.data.contracts[*].ownerEmployee.name
          type: array
          nullable: true
        owner_display_names:
          path: $.data.contracts[*].ownerEmployee.displayName
          type: array
          nullable: true
        submitter_ids:
          path: $.data.contracts[*].submitterEmployee.employeeId
          type: array
          nullable: true
        submitter_names:
          path: $.data.contracts[*].submitterEmployee.name
          type: array
          nullable: true
        submitter_display_names:
          path: $.data.contracts[*].submitterEmployee.displayName
          type: array
          nullable: true
        creator_ids:
          path: $.data.contracts[*].createEmployee.employeeId
          type: array
          nullable: true
        creator_names:
          path: $.data.contracts[*].createEmployee.name
          type: array
          nullable: true
        creator_display_names:
          path: $.data.contracts[*].createEmployee.displayName
          type: array
          nullable: true
        demand_employees:
          path: $.data.contracts[*].demandEmployees
          type: array
          nullable: true
        demand_employee_ids:
          path: $.data.contracts[*].demandEmployees[*].employeeId
          type: array
          nullable: true
        department_ids:
          path: $.data.contracts[*].department.departmentId
          type: array
          nullable: true
          availability: UNKNOWN_NOT_PROVIDED
          meaning: 该assemblySwitch路径没有填充成员真实department的保障；缺省/null保持未知。按用户决定不纳入必需读取、快照、测试或成功判据，不影响预检和交接结果。
          required_for_preflight: false
          required_for_verification: false
          missing_value_effect: NONE_ON_PREFLIGHT_OR_HANDOVER_RESULT
        handover_records:
          path: $.data.contracts[*].handover.records
          type: array
          nullable: true
          availability: NOT_PROVIDED_BY_ASSEMBLY_SWITCH
          meaning: 该路径关闭handover字段填充；不要求组内成员各自产生独立交接授权或记录。
      row_interpretation:
        collection: $.data.contracts
        key: contractId
        preserve_member_correlation: true
        rule: 按每个成员对象的contractId关联字段；不可将独立扁平数组按索引拼接，也不可把某一成员缺字段补成父组/其他成员字段。成员ID、assemblyId、type、状态和角色均以实际响应核对；缺项保持未知。
    permissions:
      data_scope: 当前登录租户内，当前用户有AUTHORIZED权限的父assembly及其全部valid=true成员
      enforcement: Controller按contractAssemblyId、businessTypeCodeKey=10校验父组AUTHORIZED及首页/合同管理/任务页功能权限；Service按tenantId+assemblyId+valid=true分页。保留该官方父组权限边界，不伪造身份或跳过校验；type17网关和权限行为按其自身证据验证。
    pagination:
      page_index_base: 0
      page_size: 100
      query_scope: tenantId + assemblyId + valid=true
      sort: sequence
      completion: 去重收集全部页直至空页，并与前后 assembly_detail.children_count 相等；重复/缺项/数量变化时重新读取，不得把差异解释成空。
      limitation: 仅完整枚举一个assembly的有效ContractBase成员；不能枚举同groupId其他assembly。灰度/草稿要求按实际处理器及状态分支判定。成员department未保障填充属已知字段限制，不影响本配方预检和交接结果。
    field_coverage:
      member_identity_status: CODE_CONFIRMED_CURRENT_CONTRACT_BASE
      owner_submitter_creator: CODE_CONFIRMED_EMPLOYEE_MAP
      demand_employees: CODE_CONFIRMED_EMPLOYEE_MAP
      department: UNKNOWN_NOT_PROVIDED
      independent_handover_record: NOT_PROVIDED_BY_ASSEMBLY_SWITCH
      department_null_means_unset: false
      employee_departments_are_contract_department: false
      parent_department_is_child_department: false
      department_validation_required: false
      department_missing_value_effect: NONE_ON_PREFLIGHT_OR_HANDOVER_RESULT
    preconditions:
    - 必须先以assembly_detail核实父组ID、处理器、本体权限与状态；用全部成员分页和前后childrenCount证明成员集合。
    notes:
    - getContractInfoOfAssembly使用assemblySwitch；基础VO填当前人员和需求人，但该switch关闭handover，不执行同时负责department填充的fillEmployeeInfoAndHandover。
    - 成员ownerEmployee.departments属于员工信息，不能替代合同持久化departmentId；父组department也不能代替成员department。
    - 父组info.contracts与本成员接口调用同一组内详情分支，成员部门缺省不要求补读或修复。
    - 组处理器只创建父组本次授权；成员交接以本次父组授权/记录+完整成员关系+当前角色/需求人回读核对，成员部门不列门槛或成功判据。
    - 部门由后端自动联动，无成员旧部门入参；该字段缺读不能导致预检或交接结果失败、UNVERIFIED或阻塞，不强制额外普通info调用。
orchestration:
  steps:
  - id: current_identity
    type: API
    depends_on: []
    recipe: current_employee
  - id: function_permissions
    type: API
    depends_on:
    - current_identity
    recipe: function_permissions
  - id: employee_candidates
    type: API
    depends_on:
    - current_identity
    recipe: employee_candidates
  - id: choose_receiver
    type: TRANSFORM
    depends_on:
    - employee_candidates
    action: 展示候选姓名和部门供用户消歧，内部ID仅用于绑定；用户已明确指定且唯一匹配时可在后续确认清单中一并确认，不要求手抄ID或重复选同一人。
  - id: employee_details
    type: API
    depends_on:
    - choose_receiver
    - current_identity
    recipe: employee_details
  - id: enumerate_candidates
    type: API
    depends_on:
    - function_permissions
    recipe: search_contracts
    when: 需要搜索或全选搜索结果
    repeat: 连续搜索全部分页并固定筛选条件；不在写入时重跑动态搜索
  - id: resolve_resources
    type: TRANSFORM
    depends_on:
    - enumerate_candidates
    - current_identity
    action: 已知ID或搜索候选逐项定位；保存内部ID、type、group；类型不明先详情消歧，禁止混用合同ID/assemblyId/ES聚合groupId。
  - id: contract_details
    type: API
    depends_on:
    - resolve_resources
    recipe: contract_detail
    when: 仅本次ContractHandover普通处理资源及该处理器关联资源；排除已确认由父组处理器更新的组内成员
  - id: assembly_details
    type: API
    depends_on:
    - resolve_resources
    recipe: assembly_detail
    when: type10/17入口或发现assemblyId
  - id: enumerate_assembly_children
    type: API
    depends_on:
    - assembly_details
    recipe: assembly_children
    when: 已确认的assembly集合
    repeat: index0起顺序分页；前后childrenCount对账
  - id: impact_preflight
    type: TRANSFORM
    depends_on:
    - contract_details
    - assembly_details
    - enumerate_assembly_children
    - function_permissions
    - employee_details
    action: 优先识别指定普通入口核心test，按ordinary_core_test核对身份、权限、接收人、真实类型、状态及双角色，关联由后端处理并说明，impact_complete保持false；不因此标BLOCKED_IMPACT_UNKNOWN。其他范围按impact_gate核对完整成员和适用影响。必要目标/人员/回读缺失仍停止。
    output_schema:
      eligible: array
      excluded: array<resource,reason>
      expected_affected_resources: array
      impact_complete: boolean
      missing_evidence: array
      handler: ContractHandover|ContractAssemblyHandover|UNKNOWN
      expected_side_effects: array<condition,target,expected,postcheck_method>
  - id: freeze_manifest
    type: TRANSFORM
    depends_on:
    - impact_preflight
    action: 冻结指定入口、真实处理器、当前状态/角色、接收人与权限快照。普通核心test保存有限result_scope及后端关联处理说明，已知同group入口去重归并以免重复触发，首轮只做一个小批次，不把指定核验集合写成完整影响集合。其他场景仍冻结完整影响项与适用配置，整体组不拆分。后台JSON指纹绑定用户可读清单。
  - id: confirm_manifest
    type: TRANSFORM
    depends_on:
    - freeze_manifest
    action: 展示指定入口、接收人、双角色变化及排除项；普通核心test同一清单说明并确认后端关联/草稿处理方式，不能承诺其他记录不变。用户确认可读清单，不要求核对技术哈希；已有同范围明确授权沿用。
  - id: refresh_before_batch
    type: TRANSFORM
    depends_on:
    - confirm_manifest
    action: 每批前复查身份、接收人、权限及冻结入口的状态/角色。普通核心test只复查本分支指定入口和已知影响，不以全量关联缺口再次拒绝；其他范围另复查完整成员。关键漂移停止并更新清单，不向旧清单补入新命中。
  - id: execute_batch
    type: API
    depends_on:
    - refresh_before_batch
    - confirm_manifest
    recipe: handover
    when: 用户确认有效且普通核心test必要条件满足，或其他范围影响完整；两种范围均不得存在必要身份/对象/回读缺口
    repeat: 同一次执行严格串行；每批逐项核对后才自动开始下一批，超时/不确定停止余批。明确续办属于resume_policy约束的关联新执行，不能自动重发原不确定项。
  - id: verify_contracts
    type: API
    depends_on:
    - execute_batch
    - freeze_manifest
    recipe: verify_contract_detail
    when: 本批包含ContractHandover普通处理资源；已确认的组处理器成员仅走verify_assembly_children，不强制普通info
  - id: verify_assemblies
    type: API
    depends_on:
    - execute_batch
    - freeze_manifest
    recipe: verify_assembly_detail
    when: 本批包含assembly本体
  - id: verify_assembly_children
    type: API
    depends_on:
    - execute_batch
    - verify_assemblies
    - freeze_manifest
    recipe: verify_assembly_children
    when: 本批包含assembly本体
  - id: reconcile
    type: TRANSFORM
    depends_on:
    - verify_contracts
    - verify_assemblies
    - verify_assembly_children
    - execute_batch
    action: 普通核心test逐指定入口匹配本次授权/新增记录及双角色前后回读，结果限定SELECTED_ENTRIES_ONLY；部门/需求人及流程/通知观察另列，不冒称全量关联已核。其他完整范围仍按原处理器核对字段、父授权/完整成员/角色回读。任何范围均不能把HTTP成功或历史记录当作本次逐份成功。
  aggregation:
    strategy: JOINED
    keys:
    - businessId
    - businessTypeCode
    - authorizedTenantId
    - authorizedEmployeeId
    output: 入口与展开影响项分别计数，逐资源关联写响应和前后回查，不以响应总成功替代业务结果。
presentation:
  outputs:
  - key: permissions
    label: 当前交接权限

# Development draft. Ordinary explicit test validates selected entries; full-impact readiness remains separate.
version: 2
name: contract-handover
business:
  intent: 将合同管理页面的合同交接转为可审核的Skill流程，复用内部页面接口；不增加专用CLI命令。
  page:
    route: /management/mine
    related_routes:
    - /management/all
    entry: 勾选合同列表底部交接；选择合同接收人后提交
  scope:
    includes:
    - 单个合同入口
    - 多个合同入口
    - 全部搜索结果经完整枚举冻结后的指定清单
    - 合同组及模板多合同组，前提是完整影响预检可证明
    - 混合清单排除不适合项并确认可交接项
    - Codex首轮适配与待测试验证清单
    excludes:
    - 审批任务转交/审批干预
    - 管理员离职一键交接
    - 独立变更需求人列表
    - 跨租户交接
    - app身份执行
    - 自动重试写请求
    - 动态异步搜索交接
    - 未说明关联影响或未获得对应授权的实际写入
    - 将普通指定入口核心测试结果宣称为全量关联或全部搜索结果通过
  ordinary_core_test:
    enabled: true
    environment: test
    priority: PRIMARY_ORDINARY_HANDOVER
    scope_mode: ORDINARY_SELECTED_ENTRIES
    selection_mode: EXPLICIT
    result_scope: SELECTED_ENTRIES_ONLY
    complete_related_inventory_required: false
    related_effects_management: SERVER_MANAGED
    side_effect_evidence_required_for_core_pass: false
    single_batch_only: true
    prerequisites:
    - 当前用户身份、租户、功能权限和唯一接收人已读取；内部ID无损，沿用既有个人授权
    - 指定入口详情已读取，真实业务类型由普通处理器处理；assemblyId字段明确为null或0，不含实际合同组及成员
    - 读取状态、当前归属人和申请人；按普通同人/不同人规则展示预期，服务端最终判定准入
    - 指定入口有可用的只读回读及本次授权/新增交接记录核验方法
    confirmation: 在一份清单中确认指定测试入口、接收人、角色变化，并知悉同group关联记录和相关草稿由后端按现有规则处理；不要求第二次确认同一影响说明
    disclosure: 接口可能联动同组关联记录，并按系统规则处理相关草稿；完整关联范围未独立枚举，本次核验指定合同的交接结果。
    stop_if: 用户要求其他任何关联记录/草稿均不变且无法证明；或身份、目标、真实类型、必要角色、回读路径不明确；或关键状态变化；或执行不确定。
    result_requirements:
    - 本次响应授权或写前不存在的新增记录与指定合同、接收人对应
    - 写后归属人和申请人按交接前关系核对，不能只凭总success
    - 部门、需求人、流程和通知有现成观察则另报；缺独立副作用证据不阻塞指定合同核心结果
    evidence_format:
      run: scope_mode=ORDINARY_SELECTED_ENTRIES、environment=test、result_scope=SELECTED_ENTRIES_ONLY、all_related_effects_verified=false
      related_effects: management=SERVER_MANAGED、disclosed=true、strict_no_related_changes=false、非空evidence_ref
      resources: entries/affected/before/after每条资源行显式resource_type和handler均为ORDINARY_CONTRACT，assembly_id保留真实读取的null或字符串0
      manifest: affected与entries的ID集合相同，每个entry.impact_ids只指自身；这是指定核验集合，不是后端全部实际影响范围
      write: impact_complete=false，实际调用只传原handover参数，不把验收字段发送给后端
      confirmation: 正常user_confirmed与清单绑定之外，related_effects_accepted=true来源于同一次用户确认
    limits: 仅受控test单批指定普通入口；不适用于ALL_RESULTS、合同组、跨批自动续发或正常生产执行。不升级全包RUNNABLE，不宣称全部关联副作用通过。
  execution_policy:
    selection_mode: FROZEN_RESOURCE_MANIFEST
    all_results_strategy: ENUMERATE_CONFIRM_SYNC_BATCHES
    write_recipe: handover
    async_dynamic_search_allowed: false
    max_entry_resources_per_batch: 100
    entry_count_unit: DEDUPLICATED_ENTRY_RESOURCES
    expanded_impact_count_separate: true
    keep_group_together: true
    mixed_batch_policy: EXPLAIN_EXCLUSIONS_THEN_CONFIRM_ELIGIBLE
    reconfirm_on_drift: true
    blind_retry_allowed: false
    cross_channel_replay_allowed: false
    batches_serial: true
    batches_execution: SERIAL
    stop_remaining_batches_on_uncertain_result: true
    stop_on_uncertain_write: true
    sync_batching_is_page_limit_provenance: true
    limit_note: 100来自页面页内勾选限制；不是服务端验证出的安全容量/事务/性能保证。单个影响闭包超过100入口不拆组，列入排除。
  impact_gate:
    ordinary_test_override: business.ordinary_core_test；此范围不要求完整关联枚举，必须保留impact_complete=false及影响说明。其余场景按本节完整范围要求。
    required: true
    complete_group_membership_required: true
    assembly_membership_required: true
    draft_effects_required: true
    current_status: UNRESOLVED
    applies_before: handover
    closed_by: 完整范围场景按处理器证明完整影响集合及回查方法；指定普通test优先按ordinary_core_test核验指定入口，不把本节全量关联缺口套成其统一拒绝条件。组成员真实部门仍不校验。实际副作用在写后核实，不要求写前已有成功证据。
    fail_closed: true
    unresolved_scenarios:
    - 普通ContractHandover按groupId展开全部valid资源，尚无已证明完整枚举页面配方
    - assembly有后继时可展开同groupId全部valid assembly；成员分页只覆盖单个assembly
    - 普通ContractHandover灰度关闭时，信息修改/作废/正常终止草稿及特定归档后继补充协议草稿可能valid=false，尚无完整枚举；该清理分支不套用到ContractAssemblyHandover
    - 确认后到写入之间无原子版本锁，成员或状态可能变化
    known_read_coverage:
      single_assembly_children: CODE_CONFIRMED_PAGINATION_WITH_COUNT_RECONCILIATION
      all_valid_contracts_by_group: UNRESOLVED
      all_valid_assemblies_by_group: UNRESOLVED
      all_affected_drafts: UNRESOLVED
      current_gray_flag: SOURCE_FIELD_FOUND_NOT_RUNTIME_VERIFIED
      single_assembly_member_roles: CODE_CONFIRMED_PARENT_AUTHORIZED_CHILDREN_INFO
    forbidden_inferences:
    - checkDrafts只返回第一个候选，不是全量预检
    - relation不是group资源清单
    - contractChange/records排除非合同类型且过滤正常终止草稿
    - 普通处理器的previousId/nextId为空不能证明无其他group成员；assembly须按已核分支单独判断
    - ES聚合成员不等于数据库全部valid影响资源
    - 成员department缺省/null不能解释成合同未设置部门
    - 员工部门或父组部门不能代替成员真实合同部门
    - 父组info.contracts与childrenInfo同源，成员部门缺省时不猜值；该字段无需补读或核验
    - 尚无本次BPM/授权/通知成功证据不单独构成写前循环门禁；其他必需事实缺失仍按原门禁处理，组成员部门缺读明确不属于门禁
    evaluation_unit: PER_RESOURCE_IMPACT_CLOSURE
    impact_scope_complete: false
    scenario_closure:
      single_assembly_without_successor:
        source_branch: ContractAssemblyHandover.java:87-95
        conditions:
        - 本体type10/17、内部ID/tenant/group由详情核实
        - nextId明确为空或<=0，且这是assembly处理器已核仅取自身分支，不推广至普通合同
        - 全部有效children分页+前后childrenCount一致并按contractId保存身份/状态/角色/需求人写前快照
        - 按父组当前角色计算ownerFlag/submitterFlag，确认本体字段和成员角色/需求人变化及BPM、授权、通知预期；明确执行后核验方式
        - status3无后继组不强加普通ContractHandover草稿失效枚举，也不要求用于草稿准入的灰度；其他状态按实际准入分支判断
        - 写前重新读取仍满足；本次BPM、授权、通知实际结果在执行后核实，不要求写前已有本次成功证据
        scope: 一个assembly本体+该assemblyId全部有效子合同；不据此宣布整个页面范围完成
        current_blockers: []
        membership_closure_is_not_full_execution_readiness: true
        member_department_validation_required: false
      assembly_with_successor: UNRESOLVED_ALL_VALID_ASSEMBLIES_BY_GROUP
      non_assembly_group: 完整关联枚举仍未解决；指定普通入口可按ordinary_core_test受控验证，仅核验指定入口
    branch_requirements:
      ContractHandover:
        ordinary_core_test: 指定普通入口的关联/草稿由后端现有规则处理，客户端说明潜在影响；下列完整枚举要求仅用于全量影响验收，不阻塞已确认核心test
        group_membership: 全部valid同group资源必须完整
        draft_cleanup: 代码255-283的灰度关闭分支须完整识别信息修改/作废/正常终止及特定后继补充协议草稿
        gray_flag: 在状态准入或草稿失效判断依赖灰度时必须读取确证
      ContractAssemblyHandover:
        membership: nextId<=0仅该assembly及其全部有效成员；有后继时须完整识别同group全部assembly及成员
        ordinary_draft_cleanup_applies: false
        gray_flag: 只在当前状态准入依赖灰度时要求；status3按固定允许范围判定，不因未查普通handler草稿而拒绝
        member_department: 由后端按父组ownerFlag自动联动，无旧部门入参；按用户决定不读取或校验成员真实部门，不纳入预检、场景闭合或交接结果判据。
      side_effect_verification_phase:
        before_write: 推导本次父组ownerFlag/submitterFlag、BPM/授权/通知具体预期，并明确合法可用的写后核验方法
        after_write: 核对本次真实执行结果；不能用历史成功代替，也不能把尚未发生的本次结果设为写前必备事实
  role_rules:
    current_owner_source: CURRENT_RESOURCE
    demand_employee_ids_unchanged: true
    department_rule: FIRST_RECIPIENT_DEPARTMENT_OR_PRESERVE
    role_specific_update: true
    contract_assembly_rules_separate: true
    submitter_only_handover_allowed: false
    submitter_only_rule_scope: NON_ASSEMBLY_CONTRACT_HANDOVER_HANDLER
    owner_submitter_update:
      equal:
        owner: RECIPIENT
        submitter: RECIPIENT
      different:
        owner: RECIPIENT
        submitter: PRESERVE
    owner_submitter_update_scope: 普通处理器的owner交接路径；第三方按旧owner计算角色，不能把规则推广到assembly。
    initial_owner_rule:
      scope: ORDINARY_CREATE_AND_DRAFT_INITIALIZATION
      equals_creator: true
      exceptions:
      - HISTORICAL_SNAPSHOT
      - AUTOMATIC_COMPLETION_RECORD
      note: 普通新建/复制初始化成立；历史原合同快照继承原owner，自动办结记录createEmployee可能机器人而owner继承原owner；交接时始终取当前owner。
    assembly:
      handler_specific: true
      submitter_only_handover_allowed: true
      members_follow_assembly_role_booleans: true
      note: 父组按flags改owner/submitter；有效交接后父组总按接收人首部门更新，空部门保留。全部有效子合同继承父组flags，只有ownerFlag时改子合同部门；不按子合同自身角色重算。
      third_party_actual_actor: OLD_ASSEMBLY_OWNER
      flags_source: ASSEMBLY_BEFORE_STATE
      parent_department_update: ANY_EFFECTIVE_HANDOVER
      child_department_update: OWNER_FLAG_ONLY
      parent_authorization_covers_verified_children: true
      owner_flag: actualActor == oldAssemblyOwner && receiver != oldAssemblyOwner
      submitter_flag: actualActor == oldAssemblySubmitter && receiver != oldAssemblySubmitter
      actual_actor: 'serverAdmin && operator != oldAssemblyOwner && operator != oldAssemblySubmitter ? oldAssemblyOwner
        : operator'
      no_flags: NO_CHANGE
  permission_rules:
    server_final_decision: true
    agent_admin_override_allowed: false
    third_party_requires_not_owner_and_not_submitter: true
    relationship_alone_sufficient: false
    third_party_requires_all_handover_function: true
    personal_scope_note: ContractBase.isOwner包含owner或demandEmployees；关系仅参与过滤，不保证实际可交接。多项Service过滤局部变量未写回DTO，不能当成可靠逐项成功结果。
  status_rules:
    normal_code_range:
    - 2
    - 17
    extra_allowed_codes:
    - 23
    cancelled_code: 1
    draft_cooperation: 依赖灰度或补充协议专门分支；未读取当前灰度不得猜测可交接
    revoked_rejected: 代码可允许，与页面历史提示存在差异；运行待验证
    assembly_members: 子合同位于进行中的assembly时普通入口可能被拒绝；应按真实组与流程状态判断
  result_policy:
    match_current_execution: true
    match_resource_id: true
    match_receiver: true
    match_tenant: true
    compare_before_after: true
    require_current_handover_record: true
    missing_record: UNVERIFIED
    preexisting_target_owner: NOT_NEW_SUCCESS
    http_success_only: UNVERIFIED
    empty_authorizations: UNVERIFIED
    missing_authorization: UNVERIFIED
    read_permission_lost: UNVERIFIED
    side_effects_not_observed: UNVERIFIED
    allow_batch_atomic_success_assumption: false
    states:
    - VERIFIED_CHANGED
    - NOT_NEW_SUCCESS
    - EXCLUDED
    - FAILED
    - UNVERIFIED
    - NOT_EXECUTED
    ordinary_fields:
    - ownerEmployee.employeeId
    - submitterEmployee.employeeId
    - department.departmentId
    - demandEmployees[*].employeeId
    assembly_fields:
    - ownerEmployee.employeeId
    - submitterEmployee.employeeId
    - department.departmentId
    - childrenCount
    - contracts[*].contractId
    - contracts[*].assemblyId
    - contracts[*].ownerEmployee.employeeId
    - contracts[*].submitterEmployee.employeeId
    - contracts[*].demandEmployees[*].employeeId
    record_matching: 本次返回authorizations中的businessId/businessTypeCode/authorizedEmployeeId/authorizedTenantId及新增记录时间，与写前快照中不存在的handover记录相互印证；仅当前owner相等或旧记录不算。
    require_current_handover_record_scope: 直接交接资源/assembly本体；组内被更新成员不强求独立授权记录
    assembly_child_evidence:
      parent_authorization_required: true
      complete_membership_required: true
      child_readback_required: true
      child_authorization_record_required: false
      membership_count_reconciliation_required: true
      actual_contract_department_readback_required: false
      missing_department: NOT_APPLICABLE_TO_RESULT
      department_null_semantics: UNKNOWN_NOT_PROVIDED
      parent_or_employee_department_substitution_allowed: false
      required_member_fields:
      - contractId
      - assemblyId
      - businessTypeCode
      - contractStatusCode
      - ownerEmployee.employeeId
      - submitterEmployee.employeeId
      - demandEmployees[*].employeeId
      required_snapshot_fields_exclude:
      - department
      - department.departmentId
      success_criteria_exclude:
      - member_contract_department
      department_validation_policy: business.assembly_member_department_policy
    assembly_fields_scope: department.departmentId仅指父组本体；成员字段按assembly_child_evidence.required_member_fields核对，不将成员部门缺读计作失败或UNVERIFIED。
    side_effects_not_observed_scope: 普通核心test仅指该副作用未核实，不降低已有证据的指定合同角色结果；其他场景仅适用于仍要求核验的副作用，组成员部门不必核验。
  side_effects:
  - 归属人交接可改部门；需求人列表不改。
  - 旧OWNER/SUBMITTER交接授权停用并建立新授权；阅读权限还受流程/分享/数据权限影响，不能承诺旧owner必失去或必保留阅读。
  - 普通流程BPM owner切换失败可能仅记日志而不中断；组流程BPM失败会抛错，事务/跨服务一致性须实际验证。
  - 普通ContractHandover仅撤回/拒绝等特定分支尝试转移旧申请人首个任务，不是全部审批待办统一交接。
  - 可能更新协商角色、通知及履约参与/提醒；提醒自定义规则和跨服务结果未全量验证。
  - 普通ContractHandover灰度关闭的相关草稿可能被置为无效，不能把交接描述成只有负责人字段变化。
  error_recovery:
    before_write_failure: 停止依赖写入，展示缺少的权限、候选、详情或影响事实；可继续无依赖的只读准备。
    business_rejected: 记录响应code/message、该批未知项并回读；不要假设整批回滚；停止后续批次。
    network_timeout_or_process_loss: 将当前批标UNVERIFIED，停止后续批次；只读回查本次影响项与授权记录，不自动重试也不切通道重放。
    partial_result: 逐项保留完成、跳过、失败、待核实和未执行。自动执行在不确定时停止；收到明确续办指令后按resume_policy创建独立新清单，原不确定项不重放。
    authorization_expired: 只通过现有CLI/MCP官方授权流程恢复；恢复后重读租户和身份，不记录或要求粘贴凭证。
    post_write_no_access: 报告回读权限不足，保持UNVERIFIED；不切换到接收人/管理员伪装回查。
  unselected_candidates:
  - path: /clm/api/permission/asyncHandoverContractList
    reason: 执行时动态搜索，框架可重试，未找到适配交接的完整任务结果/逐项失败查询；用户已选固定清单同步批次。
  - path: /clm/api/contract/checkDrafts
    reason: 返回首个草稿/协商候选，不是完整影响集合。
  - path: /clm/api/contractChange/records
    reason: 过滤业务类型与正常终止草稿，不能枚举全部valid group资源。
  - path: /clm/api/relation
    reason: 关系表视图不等于交接group资源闭包。
  - path: /clm/api/composition/contractAndTask
    reason: 页面当前聚合详情含checkAndUpdateTradingPartyStatus；不选作最小预检/回查。
  - path: /clm/api/sso/getUser
    reason: systemConfigVO.isSupportNonOwnerStartProcess可定位当前灰度候选字段；完整响应可含身份敏感字段，尚未做最小字段读取及运行核验，不拿缺失值当false。
  development_validation_enabled: true
  development_validation:
    environment: test
    require_closed_scenario: true
    require_read_recipes_runtime_verified: true
    require_explicit_test_confirmation: true
    requires_dedicated_test_manifest: true
    normal_business_execution_allowed: false
    promote_package_readiness_automatically: false
    closed_scenario_definition: 普通核心测试为指定入口、接收人、当前角色和回读方法明确且关联处理已向用户说明并确认；不宣称完整关联范围闭合。其余场景仍要求完整影响集合。
    purpose: 优先按ordinary_core_test验证指定普通合同单份与多份调用链；完整范围场景另按impact_gate。写操作仍需具体test清单确认，全包缺口和测试结果分别记录，不自动开放正常业务执行。
  resume_policy:
    requires_explicit_user_instruction: true
    preflight_remaining_again: true
    exclude_uncertain_resources: true
    require_no_overlap_with_uncertain_impacts: true
    reuse_existing_confirmation_if_unchanged: true
    reconfirm_only_if_scope_receiver_or_impact_changed: true
    new_execution_linked_to_previous: true
    repeat_uncertain_write_allowed: false
    note: 明确指向原清单剩余独立对象的续办指令可作为授权；先保留并说明原不确定结果，新执行仅包含重新预检合格的独立对象。重复原请求需先查清实际结果，不能仅凭用户说再试一次而盲目重放。
  readback_dispatch:
    normal_handler_resources:
      before: contract_detail
      after: verify_contract_detail
    assembly_handler_parent:
      before: assembly_detail
      after: verify_assembly_detail
    assembly_handler_members:
      before: assembly_children
      after: verify_assembly_children
      force_normal_contract_info: false
      department_validation_required: false
      department_missing_value_effect: NONE_ON_PREFLIGHT_OR_HANDOVER_RESULT
    unclassified_resource: BLOCK_UNTIL_HANDLER_AND_MEMBERSHIP_CONFIRMED
  assembly_side_effects:
    derivation: 按父组写前owner/submitter、接收人、当前操作人及服务端权限产生的admin标记计算父组flags；组内成员继承flags。
    phase_policy:
      preflight: 识别具体适用分支、预期对象和核验方法
      post_write: 核实本次实际结果；没有本次执行证据时不得宣称副作用成功
      requires_future_success_before_write: false
    bpm:
      execute_when: 父组submitterFlag=true且父组不是流程终态；status3适用非终态分支
      expected: 调用changeProcessInstanceOwner将父组流程owner切到接收人，随后更新父组与有效成员submitter
      failure_behavior: 返回false触发CODE_110512；不能承诺已执行的跨服务BPM与本地事务原子回滚
      verification: 执行后通过已确证的受权流程读取或服务执行证据核验；未确证具体查询配方时记录核验能力缺口，不猜端点，也不把本次写入前没有结果当失败
      verification_methods:
        controlled_test:
          prerequisites: 已确认适用组submitterHandover且父组非终态；本次同步响应成功并有匹配的父组新授权，完整父子成员角色回读符合预期。
          conclusion: CLM角色变更可按本次记录和回读判断；按已核实现的执行顺序，可推断该分支获得BPM成功响应。该推断不是独立读取流程当前owner，服务部署版本也未由源码快照证明。
          independent_runtime_owner_status: NOT_INDEPENDENTLY_VERIFIED
        authorized_service_evidence:
          method: 需要进一步验收时，由有权限的研发按本次时间窗口、tenant、processInstanceId和目标employeeId关联changeProcessInstanceOwner请求和成功响应日志；需要验证持久状态时再提供BPM实际owner读取证据。
          boundary: 不猜查询端点、不借用他人身份；没有消息授权时不自动联系研发。日志成功响应与实际持久状态分别记录。
        unavailable_fields: assembly/info的ownerEmployee与submitterEmployee是合同组角色；approveRecord、noticeRecord和processProgress不是流程owner，不能代用。
        source_basis:
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/contract/service/access/handover/ContractAssemblyHandover.java:142-146
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/api/BpmEngineApi.java:1821-1835
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/api/BpmEngineApi.java:2009-2018
    authorization:
      execute_when: 父组任一flag有效
      expected: 按父组ownerFlag/submitterFlag停用对应旧OWNER/SUBMITTER交接授权，保存父组新授权；成员不各自生成独立授权记录
      verification: 关联本次返回父组authorizations及父组新增记录，以完整成员关系逐成员核对当前角色/需求人；成员真实部门不列核验项。旧授权enabled状态若现有读取不暴露则单独标未核验。
    notification:
      dispatch: PermissionService合并处理器结果后发布成功事件，listener异步调用通知服务；接口成功不证明消息已送达
      recipient: 接收人会进入LARK_CARD_HANDOVER_COMPLETE发送分支
      previous_owner: server handoverByAdmin=true时遍历preOwnerResourcesMap发送LARK_CARD_HANDOVER_TO_PRE_OWNER；本组preOwner为ownerFlag时旧owner，否则旧submitter
      leader: manual=true且server handoverByAdmin=false时，如找到直属上级且其不是接收人，向该上级发通知
      admin_flag_note: manage_contract_handover_all会由服务端设置admin=true；它与operator既非owner又非submitter的实际第三人判定不同
      verification: 执行后按实际适用通知对象核实异步发送/送达证据；未观察到时标UNVERIFIED，不重发handover请求来补通知
      verification_methods:
        manual_observation:
          method: 写后由用户在收件人实际飞书智书合同机器人会话观察新卡片；旧归属人若也是本次操作者，可观察本人会话，接收人一侧由用户协调提供证据。写前无需取得接收人账号或直接访问其消息。
          correlation: 留存观察账号、本次时间、操作者、接收人及合同数量，并与本次父组新记录和固定成员清单关联；旧卡片不算本次证据。type10组通知不展示合同详情，数量按成员数计算，不把父组加成员的资源总数直接作为通知数量。
          boundary: 未看到卡片记通知待核实，不能判交接失败；不猜站内消息中心就是此飞书通知的入口。
        authorized_service_evidence:
          method: 必要时由有权限的研发关联本次时间、通知类型、收件人及发送日志中的msgId；没有消息授权时不自动联系研发。
          boundary: 通知记录默认businessId和businessType可为空，不保证仅按合同ID能找到；发送返回msgId不等于接收人已阅读。
        filtering: 发送链路过滤飞书合同来源租户及platform=lark的员工，也可能发生过滤异常或发送失败；未观察到消息时不臆测具体原因，确认被过滤需相应配置或日志证据。
        source_basis:
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/service/async/listener/ResourceHandoverSuccessEventListener.java:49-101
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/api/NotificationApi.java:273-334
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/service/notification/lark/LarkNotificationRecipientFilter.java:47-108
        - clm-core/src/main/java/com/bytedance/ea/saas/clm/core/service/notification/lark/AbstractLarkCardNotificationHandler.java:240-284
    controlled_test_evidence_policy:
      before_write: 具体清单须说明适用副作用及以上核验安排；可安排写后现有接口回读和人工观察，不要求先取得尚未发生的成功证据，也不要求所有副作用先新增查询API。
      after_write: 合同角色结果、BPM调用或持久状态、通知发送或送达分项记录。只有代码推断或没有消息观察时，相关副作用保留未独立核验或待核实；不以主记录变化宣称全项通过。
      incomplete_effects: 一次受控test可以收集主记录真实执行证据，同时留下未取得的副作用证据；本次整体仍未完整验收，不继续自动执行后续批次，不自动重放，不升级全包readiness。
    ordinary_handler_draft_cleanup:
      applies: false
      reason: ContractHandover255-283的草稿valid=false分支不在ContractAssemblyHandover中；不得为status3无后继组强制普通草稿预检
    remaining_delivery_gap: 仍列必需核验的BPM、授权、通知等副作用可用证据及真实执行尚未全部验证；成员部门联动不列核验项，其缺读不计入交接阻塞或成熟度缺口。全包不因本次规则调整升级readiness。
    member_department:
      expected: 由后端按父组ownerFlag自动联动有效成员的部门；接收人第一部门非空时设置，否则后端保留原部门。
      request_contract: handover无需且不传成员旧部门
      verification_required: false
      mandatory_test: false
      missing_value_effect: NONE_ON_PREFLIGHT_OR_HANDOVER_RESULT
      note: 保留后端行为事实；不读取成员旧部门、不强制普通详情、不推断缺失字段值，也不把此项视为待修复的Skill能力。
  assembly_member_department_policy:
    required: false
    source: EXPLICIT_USER_DECISION
    scope: CONTRACT_ASSEMBLY_HANDOVER_CHILD_MEMBERS
    preflight_required: false
    post_write_required: false
    required_snapshot_field: false
    required_success_criterion: false
    mandatory_test: false
    extra_detail_read_required: false
    missing_value_effect: NONE_ON_PREFLIGHT_OR_HANDOVER_RESULT
    missing_value_semantics: UNKNOWN_NOT_PROVIDED
    infer_value_when_missing: false
    server_managed: true
    old_department_request_parameter: false
    server_behavior: 父组ownerFlag为true时，后端将有效成员部门更新为接收人返回的第一部门；接收人无部门时后端保留成员原部门。Skill无须读取成员旧部门，也不据此额外调用普通详情。
    preserved_checks:
    - 当前角色和需求人
    - 本次父组授权或新增记录
    - 完整成员关系及数量对账
    - 权限、范围、接收人和确认
    - 不自动重放和其他真实门禁
    parent_and_normal_contract_policy_changed: false
runtime:
  execution_mode: HYBRID
  target_environment: test
  authorization: reuse_cli_mcp_authenticated_context
  required_capability: universal_open_web_call
  channel_policy:
    preference:
    - mcp
    - cli
    when_none_available: GUIDE_INSTALL_CLI
    resume_original_request: true
  transports:
    cli:
      status: RUNTIME_VERIFIED
      identity: USER
      entrypoint: contract-cli api call --channel web
      environment: test
      note: 通用通道及本次8类读取接口有成功证据；不表示交接写入、后置核对或全部业务场景已验证。具体本机入口见包外报告。
    mcp:
      status: UNVERIFIED
      identity: USER
      entrypoint: null
      environment: test
  id_encoding: 所有Long内部ID保留十进制字符串；禁止JavaScript浮点解析；日志以不可逆一致脱敏别名关联。
  gateway_notes:
  - CLM家族中本次记录的8类只读入口已有test运行证据；写接口和未调用入口仍待验证。
  - 不写死网关域名、MCP URL、token、identity header或租户/用户ID。
inputs:
  contract_scope:
    type: string
    enum:
    - mine
    - all
    source: 用户明确范围或页面对应范围
  contract_ids:
    type: array
    items: 内部ID字符串
    required: false
  search_expression:
    type: object
    required: false
    allowed_fields:
    - CONTRACT_NAME_FIELD
    - CONTRACT_NUMBER_FIELD
    note: 综合关键词/更多筛选必须先验证对应页面字段和语义
  verified_filters:
    type: array
    required: false
  receiver_query:
    type: string
    required: false
    required_for: HANDOVER
    note: 仅交接预检和写入需要接收人；只读查询当前角色及历史不要求此输入。
    non_empty: true
  confirmed_manifest:
    type: object
    required_before_write: true
    fields:
    - environment
    - tenant_ref
    - operator_ref
    - receiver
    - entry_resources
    - expected_affected_resources
    - before_snapshot
    - excluded_resources
    - batches
    - fingerprint
    - confirmed_at
recipes:
  current_employee:
    purpose: 读取当前运行身份的内部 employeeId/tenantId，避免混用开放平台 ID
    role: PREREQUISITE
    required: true
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/employee/info
      open_web_path: /open-web/web/clm/employee/info
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters: {}
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        employee_id:
          path: $.data.employeeId
          type: string
          nullable: false
        tenant_id:
          path: $.data.tenantId
          type: string
          nullable: false
        name:
          path: $.data.name
          type: string
          nullable: true
        departments:
          path: $.data.departments
          type: array
          nullable: true
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
  function_permissions:
    purpose: 读取当前用户功能权限码，不构造管理员或代办身份
    role: PREREQUISITE
    required: true
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/permission/function/list
      open_web_path: /open-web/web/clm/permission/function/list
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters: {}
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        authorities:
          path: $.data
          type: array
          nullable: false
        codes:
          path: $.data[*].code
          type: array
          nullable: false
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 仅检查当前登录；handover Service 再检查 manage_contract_handover_all/personal，并由服务端设置 handoverByAdmin。
  employee_candidates:
    purpose: 按姓名查找合同接收人候选，展示消歧后选择一个当前内部员工 ID
    role: PREREQUISITE
    required: true
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/employee/findEmployeesByKeywords
      open_web_path: /open-web/web/clm/employee/findEmployeesByKeywords
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters:
      keywords:
        location: QUERY
        source: USER_INPUT
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: inputs.receiver_query
      includeInvalid:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        employees:
          path: $.data
          type: array
          nullable: false
        employee_ids:
          path: $.data[*].employeeId
          type: array
          nullable: false
        tenant_ids:
          path: $.data[*].tenantId
          type: array
          nullable: false
        display_names:
          path: $.data[*].displayName
          type: array
          nullable: true
        departments:
          path: $.data[*].departments
          type: array
          nullable: true
        statuses:
          path: $.data[*].status
          type: array
          nullable: true
          item_type: integer
          source_enum: com.bytedance.ea.sass.enterprise.center.common.enumerate.StatusEnum
          meaning: 平台员工状态枚举的getValue结果；候选服务在includeInvalid=false分支只保留NORMAL，不能把任意员工详情中的1自行解释为HR在职。
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
    notes:
    - 页面仅传 keywords；此配方显式 includeInvalid=false 与页面默认一致。
    - 接口标记 Deprecated 但仍是当前交接页调用；不替换为另一同名近似接口。
    - 未传 filterCurrentEmployee/filterVisibleEmployee，不能宣称已排除自己或强制可见员工过滤。
    - data=[] 是查询成功但没有候选，不是接收人已有效；候选限额也不代表租户完整人员清单。
    - 本分支经EmployeeService.findEmployeesByKeyword过滤StatusEnum.NORMAL；底层搜索请求active=EmployeeSearchEnum.NOT_RESIGNED，含义是按平台未离职条件请求候选，不是独立核实HR劳动关系。
    - 当前ClmEmployeeTemplate.findByKeyword显式关闭这一层关键词缓存、enableDegrade=true；底层enterprise服务的降级/缓存细节未在本仓证明，不能保证瞬时组织状态快照。
    - 返回候选只能作为该查询时点的平台可选证据；需按同一内部employeeId/tenantId回读详情并核对status一致，不仅按姓名或单个status整数认定接收人有效。
  employee_details:
    purpose: 重新读取唯一接收人的当前租户、状态、部门；确认部门实际取第一项
    role: PREREQUISITE
    required: true
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/employee/getEmployeesByIds
      open_web_path: /open-web/web/clm/employee/getEmployeesByIds
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters:
      employeeIds:
        location: QUERY
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: USER_SCOPED
        from: steps.choose_receiver.employee_id
        transform: 保留十进制内部ID字符串；单个ID，不使用开放user_id
        hardcode_allowed: false
      extraDepartmentInfo:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: true
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        employees:
          path: $.data
          type: array
          nullable: false
        employee_id:
          path: $.data[0].employeeId
          type: string
          nullable: true
        tenant_id:
          path: $.data[0].tenantId
          type: string
          nullable: true
        status:
          path: $.data[0].status
          type: integer
          nullable: true
          source_type: java.lang.Integer
          source_enum: com.bytedance.ea.sass.enterprise.center.common.enumerate.StatusEnum
          mapping: EmployeeMapper使用CommonMapper.map(StatusEnum)，返回status.getValue()，源枚举为空则返回null。
          semantic_scope: 平台组织员工状态；此整数本身不证明HR在职、不证明账号未禁用/未锁定/未过期，也不是合同交接权限。
        expired:
          path: $.data[0].expired
          type: boolean
          nullable: true
          meaning: 账号是否过期；本查询的EpcEmployeeDto/EpcEmployeeInfoDto映射忽略该字段，空值不能当false。
        locked:
          path: $.data[0].locked
          type: boolean
          nullable: true
          meaning: 账号是否锁定；本查询的EpcEmployeeDto/EpcEmployeeInfoDto映射忽略该字段，空值不能当false。
        departments:
          path: $.data[0].departments
          type: array
          nullable: true
        first_department_id:
          path: $.data[0].departments[0].departmentId
          type: string
          nullable: true
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
    preconditions:
    - 必须返回且只匹配所选 employeeId；tenantId 必须等于 current_employee.tenantId。
    - 确认同租户、同内部ID的当前平台有效候选，并核对详情status与本次includeInvalid=false候选中同一人员的非空status一致；写前重新执行这两次读取，候选中仍存在唯一选定ID且详情一致，才能认定当前返回符合平台正常/未离职筛选。无需掌握全部枚举整数表；不把status=1单独写成真实在职。已知离职、删除、停用、禁用、expired/locked为true或候选/详情冲突时排除；必要有效性仍无法确认时停止对应写入。
    - departments 非空使用其返回第一项；为空保留原合同部门。不得自行选择其他部门。
    status_semantics:
      authoritative_enum: com.bytedance.ea.sass.enterprise.center.common.enumerate.StatusEnum
      dependency: com.bytedance.ea.saas:enterprise-center-common:0.3.2.9-qfei-SNAPSHOT
      numeric_mapping:
        NORMAL: null
        DELETE: null
        DEACTIVATE: null
        UNKNOWN: null
      numeric_mapping_status: DEPENDENCY_ENUM_VALUES_NOT_PRESENT_IN_CACHED_CLM_SOURCE
      numeric_mapping_note: 已核CLM使用上述枚举符号和getValue转换，但外部依赖的枚举实现未包含在此缓存仓中，数值故意留空。仓库内common.enums.operation.StatusEnum是另一个同名类，不得拿它的NORMAL(1)替代；机器人构造器setStatus(1)也不构成当前员工状态全表证据。
      runtime_normal_value_rule: 无完整整数表时，可利用已核includeInvalid=false候选服务只返回NORMAL这一语义，将本次唯一匹配候选的非空整数status记为本次环境NORMAL实测值，并要求同租户同ID详情值一致；例如候选实际返回1只能支持本次平台NORMAL值为1，不能推广为HR在职或推断其他数字。必须留存该候选与详情两次真实响应证据，不能靠旧样本或示例代入。
      detail_filtering: getEmployeesByIds -> getEmployeesWithLimit -> getEmployees -> ClmEmployeeTemplate.findByIdIn，仅按ID与租户读取并可补部门祖先信息；该链未做NORMAL/NOT_RESIGNED过滤，返回某员工不等于接收资格通过。详情可能来自EmployeeVO缓存。
      employment_status: 候选底层请求NOT_RESIGNED提供平台未离职查询语义，但本详情未暴露独立HR在职状态、离职时间或禁用原因。只能陈述平台候选/状态证据，不能称已验证真实在职；已有离职或禁用证据不能被NORMAL覆盖。
      account_flags: Epc员工映射明确忽略expired/locked，详情链只补openId与部门/展示名，不证明补齐账号有效性。true必须排除，null标注未提供；若场景要求确定未锁定/未过期而无证据，则阻断该场景写入。
      evidence_limits:
      - 外部enterprise-center-common精确版本的枚举整数全表未包含在缓存仓中；若要解释非NORMAL代码需研发提供可验证契约，不能猜测。这不是上述当前有效候选证据链成立时的额外阻断条件。
      - 现有两配方不独立证明真实HR劳动关系、账号锁定/过期状态；按本流程只陈述正常/未离职筛选结果，不新增这些字段必须非空的全局门禁。若业务明确额外要求这些事实，需单独补证再执行该场景。
      execution_boundary: H21a只读预检可凭本轮受过滤唯一候选和同ID同租户详情的非空status一致，输出当前符合正常/未离职筛选；未知全表和expired/locked空值如实说明。写前重查同样证据链；缺候选、字段冲突或明确失效时阻断，不以仅有详情的status整数放行。
  search_contracts:
    purpose: 复现全部合同/我的合同页搜索；生成待确认固定入口清单
    role: OPTIONAL
    required: false
    endpoint:
      family: CLM
      method: POST
      original_page_path: /clm/api/es/search/contractList
      open_web_path: /open-web/web/clm/es/search/contractList
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: OBJECT
      content_type: application/json
    parameters:
      pageIndex:
        location: BODY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        value: 0
      pageSize:
        location: BODY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: 100
      searchTabCode:
        location: BODY
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: inputs.contract_scope
        transform: all -> 0; mine -> 1；只接受这两个页面范围
      conditionUnits:
        location: BODY
        source: DERIVED
        required: false
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: inputs.search_expression
        transform: 仅使用已核字段；名称CONTRACT_NAME_FIELD，编号CONTRACT_NUMBER_FIELD，searchValue保留用户输入，unionType=SHOULD；用户给出名称或编号时必须传非空数组，禁止省略条件试查全部。
        schema:
          type: array
          items:
            type: object
            required:
            - searchField
            - searchValue
            - unionType
            additionalProperties: false
            properties:
              searchField:
                type: string
                enum:
                - CONTRACT_NAME_FIELD
                - CONTRACT_NUMBER_FIELD
              searchValue:
                type: string
                minLength: 1
                source: 用户本次明确给出的名称或编号，不将值拆成条件对象或字段名
              unionType:
                type: string
                enum:
                - SHOULD
        empty_policy: 只有用户明确要求无关键词范围枚举时才允许空数组；缺失字段映射时停止并澄清，不退化为无条件查询。
      filterUnits:
        location: BODY
        source: DERIVED
        required: false
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: inputs.verified_filters
        transform: 仅保留已由页面/字段定义验证的MUST条件；未知字段先澄清，不猜code
      allConditionUnits:
        location: BODY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
      searchAfter:
        location: BODY
        source: DERIVED
        required: false
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: steps.enumerate_candidates.previous_search_after
        transform: 首轮省略；之后逐字保留前页返回数组及每项类型，不将大整数经过浮点转换
      sortType:
        location: BODY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: SUBMITTED_TIME
      order:
        location: BODY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: DESC
      withStatistics:
        location: BODY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        groups:
          path: $.data.content
          type: array
          nullable: true
        entry_resources:
          path: $.data.content[*].searchContractListItems[*]
          type: array
          nullable: true
        entry_contract_id:
          path: $.data.content[*].searchContractListItems[*].contractId
          type: string
          nullable: true
        entry_contract_number:
          path: $.data.content[*].searchContractListItems[*].contractNumber
          type: string
          nullable: true
        entry_contract_name:
          path: $.data.content[*].searchContractListItems[*].contractName
          type: string
          nullable: true
        entry_business_type_code:
          path: $.data.content[*].searchContractListItems[*].businessTypeCode
          type: integer
          nullable: true
        entry_assembly_id:
          path: $.data.content[*].searchContractListItems[*].assemblyId
          type: string
          nullable: true
          meaning: 已确认为组成员时定位真实父组；不是外层groupId，父组自身的占位负值不可当父组ID。
        filtered_group_total:
          path: $.data.filteredTotalElements
          type: integer
          nullable: true
        search_after:
          path: $.data.searchAfter
          type: array
          nullable: true
        pagination_capability:
          path: $.data.paginationCapability
          type: object
          nullable: true
        tab_totals:
          path: $.data.totalElements
          type: array
          nullable: true
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
    execute_when: 输入没有已确证内部合同ID，或选择全部搜索结果
    read_only_number_lookup:
      body_example:
        pageIndex: 0
        pageSize: 100
        searchTabCode: 0
        conditionUnits:
        - searchField: CONTRACT_NUMBER_FIELD
          searchValue: <USER_PROVIDED_CONTRACT_NUMBER>
          unionType: SHOULD
        filterUnits: []
        allConditionUnits: false
        sortType: SUBMITTED_TIME
        order: DESC
        withStatistics: false
      substitutions:
        <USER_PROVIDED_CONTRACT_NUMBER>: 使用用户本次提供的完整合同编号替换；这是占位符，不得原样发送，也不得固化历史测试编号。
        searchTabCode: 示例0表示当前用户可见的全部合同；用户指定我的合同时改为1，不超出其明确范围。
      execution:
      - 使用JSON序列化器将完整body保存为本地请求文件，通过已授权通道POST到本配方open_web_path；CLI传--input-file <请求文件>，不要以shell字符串拼接用户编号。
      - 提交前断言conditionUnits为数组且其编号searchValue等于本次用户输入；第一轮就带编号条件，不先发空条件查询，也不以未映射字段探测请求。
      - 按pagination读取候选全部页，逐条保留contractId、contractNumber、businessTypeCode的同一对象对应关系；按返回contractNumber精确核对编号，零项报告未找到，多项请用户消歧。
      - 按业务类型和已核组关系分流：type10/17父组用assembly_detail；已确认的组内成员用其真实assemblyId读取父组和assembly_children，并按成员contractId定位，不要求该成员再走普通info；仅ContractHandover普通处理资源用contract_detail。外层groupId、父组占位assemblyId不得当真实父组或合同ID；组关系未确认时保持待核实。
      - 按对应配方读取其有填充保证的当前角色与历史，普通详情遵守contract_detail.history_interpretation；如展示组成员部门，缺省保持未知，不补读或校验，父组历史属于父组记录，不能冒充成员独立历史或推断成员字段变化。该只读请求不要求接收人或交接确认。
      failure_policy: 结构缺失、编号不符或历史字段不能解释时报告具体缺项；业务运行不以访问Java源码或verification目录中的预期答案补全配方。
    pagination:
      unit: CONTRACT_GROUP
      offset_window: 10000
      strategy: PRESERVE_SEARCH_AFTER
      completion: 连续分页直到空/终止页并核对 filteredTotalElements 聚合组数量；异常、重复游标、计数漂移、窗口上限且无有效游标都停止，不宣称查全。
      snapshot_warning: 搜索分页不是数据库快照；冻结的是枚举后的显式资源，不保证分页中途一致；写前重读关键字段。
      page_index_base: 0
      page_index_during_cursor_scan: 0
    notes:
    - filteredTotalElements 是聚合组计数，totalElements 是各tab数组，不是合同入口数量。
    - 外层 groupId 不是 contractAssemblyId；资源从 searchContractListItems 提取，按详情确认 businessId/businessTypeCode/parentId。
    - 名称和无分号的编号搜索是模糊候选；逐条核对名称/编号，必要时由用户消歧。只有分号编号策略不同也不能省略核对。
    - 本配方覆盖明确字段搜索；页面综合全部搜索的 allConditionUnits=true 需要单独显式选择及字段验证，不自动扩大搜索语义。
    - 不发送 tenantId/employeeId/searchIndex；Controller/服务从登录上下文补齐。
    - 游标方式每次pageIndex=0，原样传回searchAfter，固定排序；此组合已在test完成含空末页的12组样本枚举。后续页paginationCapability可为空，不能因此丢弃已获游标或伪造能力。

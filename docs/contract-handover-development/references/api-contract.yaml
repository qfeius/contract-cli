    - 父组info.contracts与本成员接口调用同一组内详情分支，成员部门缺省不要求补读或修复。
    - 组处理器只创建父组本次授权；成员交接以本次父组授权/记录+完整成员关系+当前角色/需求人回读核对，成员部门不列门槛或成功判据。
    - 部门由后端自动联动，无成员旧部门入参；该字段缺读不能导致预检或交接结果失败、UNVERIFIED或阻塞，不强制额外普通info调用。
  handover:
    purpose: 对用户确认的固定入口资源执行合同交接，每批至多100个入口且同影响组不拆分
    role: PRIMARY
    required: true
    endpoint:
      family: CLM
      method: POST
      original_page_path: /clm/api/permission/handover
      open_web_path: /open-web/web/clm/permission/handover
    operation:
      read_or_write: WRITE
      identity: USER
      confirmation: REQUIRED_BEFORE_EXECUTION
    request:
      body_mode: OBJECT
      content_type: application/json
    parameters:
      manual:
        location: BODY
        type: boolean
        meaning: 是否手动发起交接；本Skill固定为true，不用于选择变更哪种人员角色。
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: true
      reason:
        location: BODY
        type: string
        meaning: 交接原因；本配方沿用页面空字符串。
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: ''
      targetEmployeeId:
        location: BODY
        type: string
        backend_type: Long
        meaning: 接收人的内部员工ID；十进制字符串保真，不使用开放user_id。
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: USER_SCOPED
        from: steps.confirm_manifest.receiver.employee_id
        transform: 使用确认且写前重新核对的内部员工ID字符串
        hardcode_allowed: false
      targetTenantId:
        location: BODY
        type: string
        backend_type: Long
        meaning: 接收人所在租户ID；本Skill显式传当前同租户值。
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: USER_SCOPED
        from: steps.confirm_manifest.receiver.tenant_id
        transform: 必须等于当前运行租户；不得跨租户代入
        hardcode_allowed: false
      resourceList:
        location: BODY
        type: array
        meaning: 固定的交接入口清单；单份一个入口，多份多个入口；合同组以父组为入口，由后端展开其有效成员。
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: steps.confirm_manifest.current_batch.entry_resources
        transform: 去重并冻结[{businessId,businessTypeCode,parentId}]；parentId从详情groupId取得；不添加admin/operator/tenant身份覆盖
        item_schema:
          businessId: 内部合同ID或合同组本体ID字符串
          businessTypeCode: 当前详情返回的整数类型码
          parentId: 当前详情groupId字符串；不能以ES外层ID替代
        item_backend_types:
          businessId: Long
          businessTypeCode: Integer
          parentId: Long
        business_type_examples:
        - code: 0
          name: 合同申请
          entry: 独立合同时取合同ID；如实际属于模板多合同组，先根据assemblyId和成员关系定位父组，本Skill按整组范围确认后提交，不能仅凭type0判为独立合同。
        - code: 10
          name: 合同组申请
          entry: 父合同组ID
        - code: 17
          name: 批量合同申请（模板多合同）
          entry: 父批量合同组ID
        - code: 11
          name: 合同组下的主合同
          entry: 不直接提交该子项；核实所属父组后，以父组真实ID及类型码交接，并确认整组影响。
        type_selection: 上述仅为已核类型示例，不是完整类型清单或可交接白名单。以当前详情真实businessTypeCode及组关系决定入口，不能把所有单合同硬填0，也不能只凭type0排除组成员身份。parentId取该入口的groupId，不是子合同assemblyId。
        group_entry_scope: 整组提交是本Skill当前范围规则；后端普通处理器对父组已终态的type0成员另有允许分支，不能将当前Skill规则描述为后端一律禁止子项交接。该独立分支不因本文示例而新增到已验证场景。
        constraints:
        - 1..100个去重入口
        - 组及重叠影响闭包不拆分
        - 整体成员超100入口则先排除该组并说明限制
    response:
      success:
        http_status: 200
        predicates:
        - $.code == 200
        - $.success == true
      fields:
        authorizations:
          path: $.data.authorizations
          type: array
          nullable: true
        authorization_ids:
          path: $.data.authorizations[*].authorizationId
          type: array
          nullable: true
        business_ids:
          path: $.data.authorizations[*].businessId
          type: array
          nullable: true
        business_type_codes:
          path: $.data.authorizations[*].businessTypeCode
          type: array
          nullable: true
        recipient_ids:
          path: $.data.authorizations[*].authorizedEmployeeId
          type: array
          nullable: true
        authorized_tenant_ids:
          path: $.data.authorizations[*].authorizedTenantId
          type: array
          nullable: true
        approved_employee_ids:
          path: $.data.authorizations[*].approvedEmployeeId
          type: array
          nullable: true
        creation_times:
          path: $.data.authorizations[*].createTime
          type: array
          nullable: true
    permissions:
      data_scope: 当前已授权用户所在租户及服务端数据权限范围
      enforcement: Controller 和 Service 权限独立判定；接口可调用不代表可交接任意合同。
    preconditions:
    - 函数权限和当前角色允许；本地仅预判，服务端终判。
    - 接收人和每个入口详情是当前环境、租户，ID未混用开放ID。
    - 指定普通test按business.ordinary_core_test核实必要事实并说明服务端关联处理；其他场景仍需完整影响集合和适用配置证据。组成员真实部门不列门槛。
    - 展示指定可交接、排除项及理由、接收人和角色变化后取得确认；普通核心test同时说明后端关联及草稿影响，未知总量不填写为零。完整范围场景另列展开数量。
    - 确认覆盖本次冻结清单指纹、接收人、角色/部门规则和全部批次；写前字段漂移重新确认。
    - 全包未完成时禁止正常业务执行；development_validation条件满足且用户确认具体清单时，可受控验证普通指定入口或完整范围场景，不自动提升包状态。
    - 普通核心test只强制本次授权及双角色回读；BPM/旧授权/通知不另加前置调用或核心通过门槛。其他场景的适用副作用分项核实，不形成未来成功证据的前置循环。
    notes:
    - reason 空字符串复现页面：DTO虽有NotBlank但Controller没有@Valid，不凭注解强加页面未要求原因。
    - businessType 是DTO由businessTypeCode推导的枚举getter；页面另传名称，执行只使用已核code，不猜名称枚举。
    - 请求没有onlyOwner/onlySubmitter或其他指定只变更某人员角色的参数；后端根据操作人、当前归属人、申请人、接收人及实际权限计算角色变化，不能通过修改类型码选择角色。
    - handoverByAdmin 不发送。Service根据当前权限覆盖，不能把该字段用于客户端提权。
    - 响应只有 authorizations，没有逐项失败/跳过清单；data为空或authorizations少于影响项不能报告全成功。
    - 每项处理有事务，handler采用并行资源处理，无整体批次事务；失败、超时、进程中断可能已经部分成功。
    - 未发现请求幂等键/安全重试凭据；绝不自动重放，也不因CLI超时切MCP重发。
    - 组内成员部门由后端自动联动，Skill无成员旧部门入参；无需为交接读取或校验成员真实部门，其他权限、完整范围、角色、确认与不重放要求不变。

      data_scope: 仅已通过当前用户流程读取权限的实例及其对应真实表单定义
      enforcement: 同一test USER的Open Web通道；不传认证身份头，不因拒绝切换用户或端点
    execute_when: 已成功取得目标流程记录，需要按节点核验历史人员，作为任务中心归因的审计和缺原始任务时的回退
    failure_handling:
      authorization: 按 references/user-authorization.md 恢复 USER 授权；pending 时等待用户完成，成功后只续办原请求一次。
      permission_denied: 记录对应人员、合同或流程的权限缺口并停止该对象；不切换身份、接口或数据库补数。
      business_failure: 同时检查 HTTP 与业务 success/code；失败保留 partial 诊断，不改写为空集合或零。
      timeout_or_unknown: 只读请求按采集脚本的有界策略重试，仍失败则停止该对象并标记 partial；不无限重试。
orchestration:
  steps:
  - id: prepare_scope
    type: TRANSFORM
    depends_on: []
    action: 区分任务结束窗口、显式业务/实例、单值employee_name或department_name以及resume_file；三种发现入口互斥。准备employee_lookup.keyword和department_lookup.keyword；已有明确业务/实例时设resolve_only=true，禁止用合同日期限制年度分析
  - id: lookup_employees
    type: API
    depends_on:
    - prepare_scope
    recipe: employee_lookup
    when: employee_name非空且非resume_file，仅当前单个姓名/内部ID查询
  - id: lookup_departments
    type: API
    depends_on:
    - prepare_scope
    recipe: department_lookup
    when: department_name非空且非resume_file，仅当前单个部门关键词查询
  - id: resolve_targets
    type: TRANSFORM
    depends_on:
    - prepare_scope
    - lookup_employees
    - lookup_departments
    action: 姓名候选按employeeId去重；部门树中只选择名称实际匹配关键词的节点，不能把所有后代误作同名候选。selected_employee_id或selected_department_id必须在候选中；多个候选返回needs_selection，空候选not_found。只有唯一或明确选定候选可继续。选定部门及其子树加入按ID防环的department_queue，每部门page_index=1；数量上限默认0不限
    when: 非resume_file路径；resume时复用同profile已解析roster及合同分页状态
  - id: load_members
    type: API
    depends_on:
    - resolve_targets
    recipe: department_members
    when: 非resume_file路径且department_queue非空
    for_each: steps.resolve_targets.department_queue
    pagination: 逐部门页码从1开始；递归队列同时合并lookup.childDepartments与response.subDepartments，include_subdepartments=true时对子部门各自分页；内部ID去重、防环；直属为空不结束子部门遍历
  - id: resolve_employees
    type: TRANSFORM
    depends_on:
    - resolve_targets
    - load_members
    action: 选择单个人员或合并所选部门当前成员，按employeeId去重并合并当前departments；输出employees/approver_ids，组织失败标coverage.roster_complete=false。明确业务或实例场景仅resolve_only找人；resolve-only不扩大业务范围。历史调岗/离职未还原。resume_file只继承同profile已核验roster，不恢复组织分页，组织缺口必须重新查找
  - id: prepare_raw_tasks
    type: TRANSFORM
    depends_on:
    - resolve_employees
    action: 为每个目标employeeId核验目录larkId，初始化状态0和1独立游标；不得把employeeId/openId/userId当larkId，缺失时按真实employeeId补查目录
  - id: discover_raw_tasks
    type: API
    depends_on:
    - prepare_raw_tasks
    recipe: raw_person_tasks
    when: candidate_source默认为raw-tasks且resolve_only=false且未指定业务/实例
    for_each: steps.prepare_raw_tasks.employee_and_status
    pagination: 两状态分别翻页到空；首短页不结束、游标原样且精度不变；重复页/无进展/失败标partial
  - id: select_raw_task_instances
    type: TRANSFORM
    depends_on:
    - discover_raw_tasks
    action: 全量任务完成分页后按窗口end_time筛已办候选，发现阶段保留全部待办；按全局task_instance_id去重并保留真实process_instance_id供下游联合核验，流程实例去重但保留每份业务关联及task_records原始任务清单。业务类型未返回时保持null，不猜0
  - id: prepare_participant_pages
    type: TRANSFORM
    depends_on:
    - resolve_employees
    action: 为每个唯一employeeId初始化独立page_index=0、previous_response和组分页状态；运行中无损保存该人员上一页searchAfter；禁止把别人的游标或部门ID用于搜索
  - id: discover_participants
    type: API
    depends_on:
    - prepare_participant_pages
    recipe: participant_contracts
    when: 仅显式candidate_source=participant-index，且已核验人员且无显式业务范围；不作为默认或raw-tasks失败后的静默fallback
    for_each: steps.prepare_participant_pages.employees
    pagination: 逐人独立游标与累计页数/业务上限，唯一group数等于filteredTotalElements才完整；展开组内条目按业务类型/ID去重。continuation保存未消费pending条目，达到上限不能丢掉已读取当前页剩余合同
  - id: discover
    type: API
    recipe: efficiency_contracts
    depends_on:
    - prepare_scope
    when: 没有businesses/process_instances，且employee_name、department_name、resume_file及已核验人员/部门对象均为空；已披露盖章样本口径与discovery_start/discovery_end；not_found/needs_selection/partial不得自动转看板
    pagination: 按recipe.response.pagination遍历至完成或异常；仅用户显式正数设置页数或业务上限时允许有限试跑
  - id: select_businesses
    type: TRANSFORM
    depends_on:
    - prepare_scope
    - resolve_employees
    - discover_participants
    - discover
    - select_raw_task_instances
    action: 优先显式业务/实例，否则默认从原始人员任务生成process_instances并保留task_records做对账；未知类型按实例读权限取得records真实businessId/type；只有显式ES模式才使用contractList候选。不得手工插入回归合同来伪装自动发现
  - id: load_contract
    type: API
    recipe: contract_info
    depends_on:
    - select_businesses
    when: 当前业务为已确认的普通合同
    for_each: steps.select_businesses.businesses
  - id: load_assembly
    type: API
    recipe: assembly_info
    depends_on:
    - select_businesses
    when: 当前业务为合同组申请类型10或批量合同申请类型17，保留真实业务类型；未在线验证
    for_each: steps.select_businesses.businesses
  - id: select_failed_details
    type: TRANSFORM
    depends_on:
    - select_businesses
    - load_contract
    action: 仅挑出contract_info业务码110002的当前合同；110004立即标不可读并停止对应业务，不通过其他端点重试；保留失败业务ID和类型
    allowed_business_codes:
    - 110002
    forbidden_business_codes:
    - 110004
  - id: recover_contract_instance
    type: API
    depends_on:
    - select_failed_details
    recipe: contract_brief_info
    when: 当前合同完整详情110002且未遇权限拒绝
    for_each: steps.select_failed_details.businesses
  - id: resolve_instances
    type: TRANSFORM
    depends_on:
    - select_businesses
    - load_contract
    - load_assembly
    - recover_contract_instance
    action: 优先接纳有来源的inputs.process_instances或steps.select_businesses.process_instances，否则使用成功contract_info/assembly_info，或仅110002恢复的contract_brief_info真实PID与业务类型绑定；原始任务未返回类型时仅按真实PID读取records。不得猜PID，data空或类型不符标未解决。合同组共享实例与历史实例在任务层去重，不能把groupId对应的所有生命周期合同视为同一流程
  - id: read_records
    type: API
    recipe: process_records
    depends_on:
    - resolve_instances
    when: 前序取得真实processInstanceId；已知businessId/businessTypeCode才一并传入，由服务端校验当前用户流程读取权限
    for_each: steps.resolve_instances.instances
  - id: find_missing_departments
    type: TRANSFORM
    depends_on:
    - read_records
    action: 只扫描 done+todo 的 records，收集部门缺失的真实 employeeId 并去重、分批逗号连接；不接受 forecast 新候选人
  - id: enrich_departments
    type: API
    recipe: employees
    depends_on:
    - find_missing_departments
    when: 发现缺部门且需要部门分析
  - id: prepare_evidence
    type: TRANSFORM
    depends_on:
    - read_records
    action: scripts/collect_records.py采集时传--with-definition-metadata；按原始record实例/定义/节点分组，保留全部人员与任务。核对详情metadata的实例绑定，准备真实businessId/type/processInstanceId/formId；当前配置不能冒充历史快照
  - id: historical_node_people
    type: API
    recipe: historical_node_people
    depends_on:
    - prepare_evidence
    when: 目标节点需要人数核验且对应真实ID已知
  - id: historical_process_instance
    type: API
    recipe: historical_process_instance
    depends_on:
    - prepare_evidence
    when: 目标节点需要人数核验且对应真实ID已知
  - id: historical_form_definition
    type: API
    recipe: historical_form_definition
    depends_on:
    - prepare_evidence
    when: 目标节点需要人数核验且对应真实ID已知
  - id: prove_node_people
    type: TRANSFORM
    depends_on:
    - historical_node_people
    - historical_process_instance
    - historical_form_definition
    action: scripts/collect_participant_evidence.py；历史record/raw instance/form三者definition严格相同且published=true；固定单提交人或可执行固定单人表达式，真实参与人/完整原始任务一致，检查任务及父动作无代理转办加签。固定定义必须非动态，当前覆盖为空仅作额外检查，不代表历史快照。任一缺失、相同任务ID冲突或矛盾不得complete=true；多人证据用于审计，个人统计仍优先按原始任务中心归因
  - id: reconcile_records
    type: TRANSFORM
    depends_on:
    - prove_node_people
    - select_raw_task_instances
    when: candidate_source为raw-tasks且已取得task_records
    action: scripts/reconcile_records.py以discovery和补证bundle核对实例/任务ID、时间及窗口，保留缺失与差异；不读取报告，不把非审批节点纳入效率。缺原始任务清单的显式业务或ES模式不得宣称完成此来源对账
  - id: analyze
    type: TRANSFORM
    depends_on:
    - prove_node_people
    - reconcile_records
    - enrich_departments
    - resolve_employees
    action: 仅使用已成功读取并完成补证的记录，必要时补缺失部门；完整保留employees人员清单、approver_ids、task_records、businesses、coverage、diagnostics及有来源的node_participant_evidence。原始任务按流程实例ID+任务ID归因到discovered_for_employee_ids，再与流程记录连接节点类型、动作和时间；多人节点中可明确归因的人工任务计入对应人员。scripts/analyze_records.py输出schema2.2总览、每人三个阶段零行、明细及诊断；参与候选不等于已办
  aggregation:
    strategy: JOINED
    source_recipe: process_records
    processor: scripts/analyze_records.py
    scan_sections:
    - done
    - todo
    excluded_sections:
    - forecast
    node_type_codes:
    - 1
    - 2
    - 3
    completed_status_codes:
    - 1
    - 2
    handled_command_codes:
    - 1
    - 2
    - 10
    in_progress_status_codes:
    - 0
    deduplication_key:
    - processInstanceId
    - processTaskInstanceId
    conflict_policy: 同任务按统计字段规范化后比较；忽略createTimeSpan/endTimeSpan/头像/展示文字，仅真正指标或归属冲突的副本全部排除并诊断
    time_window:
      field: endTime
      bounds: '[start,end)'
      timezone: Asia/Shanghai
    duration:
      unit: seconds
      formula: endTime - createTime
      calendar: natural_elapsed
      negative_or_missing: exclude_with_diagnostic
      forbidden_duration_fields:
      - createTimeSpan
      - endTimeSpan
    mean:
      formula: sum(valid_duration_seconds) / count(valid_completed_tasks)
      denominator: valid_completed_tasks
      empty: 0
      empty_semantics: 按用户要求，聚合表无有效样本显示0；不将缺失、无权限或未知人数解释为真实零耗时
      detail_missing_duration: null
      pending_in_denominator: false
      node_mean_is: task_average_not_parallel_node_wall_clock
    groups:
      by_approver:
      - employeeId
      - nodeTypeCode
      by_department:
      - sorted current departmentId set
      - nodeTypeCode
      by_process_node:
      - processDefinitionId
      - nodeId
      - nodeTypeCode
    attribution:
      department_basis: CURRENT
      multiple_departments: COMPOSITE_BUCKET_NO_DUPLICATION
      multiple_assignees: ATTRIBUTE_BY_PERSON_TASK_CENTER_OTHERWISE_EXCLUDE_PERSONAL
      personal_node_policy: SOURCE_TASK_ATTRIBUTION_FIRST_HISTORY_SINGLETON_FALLBACK
      source_task_attribution:
        input: bundle.task_records
        key:
        - process_instance_id
        - task_instance_id
        employee_ids: discovered_for_employee_ids
        completed_requires_unique_person: true
        pending_may_count_each_visible_person_task: true
        auto_end_or_nonhuman_action_excluded: true
      node_key:
      - processInstanceId
      - processDefinitionId
      - nodeId
      - nodeTypeCode
      participant_union_scope: ALL_DONE_TODO_RECORDS_AND_PARENT_ASSIGNEES_BEFORE_LOCAL_FILTERS
      multi_person_rule: observed_employee_ids UNION evidence.employee_ids contains more than one unique employee
      mode_proves_count: false
      missing_round_id: CONSERVATIVELY_MERGE_SAME_INSTANCE_DEFINITION_NODE
      unknown_participant_count: EXCLUDE_PERSONAL_WITH_SEPARATE_DIAGNOSTIC
      participant_evidence:
        input: bundle.node_participant_evidence
        key:
        - processInstanceId
        - processDefinitionId
        - nodeId
        employee_ids: REAL_INTERNAL_EMPLOYEE_IDS
        complete_required: true
        nonempty_source_required: true
        single_required: true
        observed_must_be_subset: true
        conflicting_evidence: REJECT_INPUT
        complete_runtime_recipe_verified: true
        fabricated_completeness_forbidden: true
        complete_runtime_recipe_scope: EXACT_HISTORICAL_FIXED_SINGLETON_NO_REASSIGNMENT
        participant_api_alone_proves_complete: false
        processor: scripts/collect_participant_evidence.py
      unknown_department: DIAGNOSTIC_NOT_ZERO
      inconsistent_department_snapshots: KEEP_PERSON_AND_NODE_EXCLUDE_DEPARTMENT_WITH_DIAGNOSTIC
    business_identity:
      precedence: RECORD_BUSINESS_ID_AND_TYPE_FIRST
      wrapper_fallback: ONLY_SAME_PROCESS_INSTANCE
      missing: KEEP_DETAIL_AND_VALID_TASK_METRICS_EXCLUDE_CONTRACT_COUNT
      metadata: MATCH_BUSINESS_TYPE_AND_ID_TO_VERIFIED_REGISTRY_OR_WRAPPER
      invented_id_or_name_allowed: false
    count_units:
      contract_deduplication_key:
      - businessTypeCode
      - businessId
      handled_counts: UNIQUE_VALID_COMPLETED_TASKS
      approved: valid completed task with status != 2 and command != 2
      rejected: valid completed task with status == 2 or command == 2
      pending: status 0 with valid createTime before end and no endTime
    roster:
      source: bundle.employees
      complete_required_for_all_people: true
      initialize_all_selected_people_and_stages: true
      default_stage_codes:
      - 1
      - 2
      - 3
      missing_roster: OBSERVED_PEOPLE_ONLY_WITH_COVERAGE_WARNING
      aggregate_empty_values: 0
    coverage:
      universe: USER_BUSINESSES_OR_TARGET_BPM_TASK_INSTANCES_OR_EXPLICIT_LIST_FALLBACK
      full_population_guaranteed: false
      history_complete_guaranteed: false
      all_instances_visible_audit_log: false
      mandatory_notes:
      - 权限范围
      - 发现方式、选定人员/部门、是否包含子部门、成员及每人每状态任务页数；ES备用另列组/合同页数与截断，仅看板fallback另披露盖章日期窗口
      - 请求时区及传递验证状态
      - 原始实例数与实际历史实例覆盖
      - 拒绝/缺失/冲突/截断记录
      - 当前部门口径
      - 在途为抓取时状态，不是历史积压快照
      - 个人统计列出任务中心已归因的多人节点任务，以及仍无法归因和单人条件待确认的数量
      - 总览可保留被个人统计排除的有效任务，不能要求两者相加一致
      count_definitions:
        input_response_count: 输入响应数，包含重复抓取
        unique_business_count: 已识别(businessTypeCode,businessId)去重数量
        unique_process_instance_count: 原始done/todo任务自身流程实例ID去重数量
    local_filters:
    - approver_ids
    - department_ids
    - process_definition_ids
    - node_types
  discovery:
    processor: scripts/discover_businesses.py
    outputs:
    - employees
    - businesses
    - approver_ids
    - coverage
    - diagnostics
    - continuation
    - process_instances
    - task_records
    identity_namespace: EMPLOYEE_ID_FOR_ANALYSIS_DIRECTORY_LARK_ID_FOR_BPM_QUERY
    include_subdepartments_default: true
    employee_deduplication_key: employeeId
    department_deduplication_key: departmentId
    group_deduplication_key:
    - employeeId
    - groupId
    business_deduplication_key:
    - businessTypeCode
    - businessId
    name_ambiguity: REQUIRE_SELECTION
    contract_date_filters_allowed: false
    object_failure_falls_back_to_dashboard: false
    scope: TARGET_EMPLOYEE_RAW_BPM_TASKS_WITH_CURRENT_USER_RECORD_PERMISSION
    all_tenant_tasks_guaranteed: false
    input_modes:
    - employee_name
    - department_name
    - resume_file
    input_modes_mutually_exclusive: true
    resolve_only_preserves_explicit_business_scope: true
    resume_scope: SAME_SOURCE_PERSON_STATUS_CURSOR_ONLY
    per_employee_limits:
    - max_pages
    - max_businesses
    per_employee_limits_applies_to: PARTICIPANT_INDEX_ONLY
    raw_task_limit_semantics: max_pages按每人每状态累计；max_businesses按本次合并后的候选实例累计；默认均0不限
    roster_limits:
    - max_member_pages
    - max_departments
    default_limits: 0
    zero_limit_semantics: UNLIMITED_UNTIL_PAGINATION_COMPLETE_OR_ERROR
    positive_limits: EXPLICIT_USER_TRIAL_ONLY
    business_output_fields:
    - businessId
    - businessTypeCode
    - assemblyId
    - contractName
    - contractNumber
    - matched_employee_ids
    default_candidate_source: raw-tasks
    task_deduplication_key:
    - process_instance_id
    - task_instance_id
    participation_index_is_required_filter: false
    known_contract_checkpoint: 验证正常发现包含指定业务；缺失标partial，不人工插入
    collector: scripts/collect_records.py
    reconciliation: scripts/reconcile_records.py
presentation:
  outputs:
  - key: process_definition_id
    label: 流程定义ID
    recipe: process_records
    field: process_definition_id
    fallback: 缺失则无法进入流程节点组，列质量诊断
  - key: node_name
    label: 审批节点
    recipe: process_records
    field: node_name
    fallback: 依次用 nodeName、父节点名称、nodeId
  - key: node_type
    label: 节点类型
    recipe: process_records
    field: node_type
    mapping: node_type
    fallback: 未知类型排除并诊断
  - key: approver
    label: 审批人
    recipe: process_records
    field: employee_name
    fallback: 真实 employeeId；多人任务待归因
  - key: departments
    label: 当前部门
    recipe: process_records
    field: departments
    fallback: 缺失部门单列诊断，不虚构
  - key: created_at
    label: 任务创建时间
    recipe: process_records
    field: created_at
    fallback: 无效时间排除并诊断
  - key: ended_at
    label: 任务结束时间
    recipe: process_records
    field: ended_at
    fallback: 未结束不纳入均值
  mappings:
    node_type:
      '1': 审批
      '2': 盖章
      '3': 归档
  format: Markdown按analysis_subject路由与schema2 JSON；审批明细优先Excel，失败回退CSV
  schema_version: 2.2.1
  user_visible_scope:
    contract_count: UNIQUE_BUSINESS_KEYS_OF_VALID_COMPLETED_TASKS_ACROSS_NODE_TYPES
    people_basis: ONLY_TASKS_ATTRIBUTED_TO_SELECTED_PEOPLE
    show_collection_process_counts: false
    partial_collection_notice: BRIEF_WITHOUT_COUNTS
  default_sections:
  - overview_and_insights
  - personal_stage_tables
  - details_file
  output_modes:
    people:
      condition: 用户明确点名一人或多人
      sections:
      - personal_stage_tables
      - details_file
      show_overview: false
      show_insights: false

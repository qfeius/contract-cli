  limitations:
  - 个人统计依赖原始任务中心与流程记录按流程实例ID+任务ID成功连接；缺任务、归因多人或对账冲突时保留明细并排除。历史人数补证只作回退和审计；具体人员模式仍不输出总览
  - taskModeCode既不证明人数也不保证对应历史版本；多人节点能否计入个人，取决于是否取得明确的个人任务及有效人工动作
  - listAllApprovalEmployees已加入补证编排，但单独只提供人员到节点映射；必须联合匹配历史实例、已发布固定定义和原始任务动作，不能单独填写complete=true
  - 非空运行证据覆盖人员/部门发现、参与合同分页、contract_info、contract_brief_info、process_records、原始人员任务及历史人数联合补证；assembly_info、employees均未运行验证
  - 合同组详情代码支持10/17：BusinessType.java:135,296的isContractAssemblyType包含两者，ContractAssemblyService.java:1058,1080共用详情及批量分支；不代表test类型17已实测
  - 时区头运行证据仅覆盖 contract_info 的 4 条和 process_records 的 8 条固定任务；efficiency_contracts 空结果无法单独验证时区效果
  - 成功样本不代表所有合同可访问；41 份 110004 无权限合同保持未获取，未作为成功、零审批或零耗时统计
  - 效率看板日期底层 SQL 和完成状态口径尚无运行证据
  - 新通用发现helper离线回归不等于更多场景线上实测；已观察部门成员均在第一页结束，成员多页/深层递归/同名消歧须遵循边界而不能标已线上验证
  - 参与权限索引在任务开始时登记，可能含历史参与者和组内其他合同；只有任务记录归属、状态/动作及endTime共同满足才计数
  - 当前目录成员不还原历史调岗/离职；非空部门关键词不保证showAllStatus生效；无权限或搜索索引缺失不代表全年没有处理
  - searchAfter必须无损保留19位整数，禁止以JavaScript普通Number解析后回传；组分页数与最终合同数分别报告

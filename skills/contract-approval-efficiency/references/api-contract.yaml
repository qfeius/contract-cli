version: 2
name: contract-approval-efficiency
business:
  intent: 按分析对象输出审批/盖章/归档效率；具体人员只展示个人分阶段表，部门及其他范围展示总览与个人表，并交付可追溯的Excel明细
  page:
    route: /statistics-dashboard/efficiency
    related_pages:
    - /statistics-dashboard/efficiency-detail/:contractType
    - 合同详情审批记录
    - 合同组详情审批记录
    route_status: 前端效率页面与后端配方已静态确认；本 Skill 不依赖页面截图抓取
  scope:
    includes:
    - 按姓名或当前部门解析人员及目录larkId；逐人读取BPM原始已办/待办并以流程记录核对实际动作
    - 用户指定业务或发现样本内的页面可见审批记录
    - 审批人和当前部门的本地 ID 筛选
    - 流程定义 ID + 节点 ID + 节点类型的任务均值
    - Markdown按对象路由：单人查询合并审批/盖章/归档为一张表，多人按节点分表；部门及其他范围展示总览与洞察、三张个人阶段表、明细文件；JSON保留全部指标
    - 个人统计优先按原始任务中心归因，多人节点中可确认实际处理人的任务纳入；全部已核验人员在三个阶段保留零行
    excludes:
    - 租户全量已办任务保证
    - 历史部门还原
    - 并行节点整体墙钟时长或节点执行轮次
    - 工作时长或剔除节假日用时
    - 修改审批、签章、归档、发布流程或直接查询内部 BPM/数据库
runtime:
  authorization: reuse_cli_mcp_authenticated_context
  transports:
    cli:
      status: RUNTIME_VERIFIED
      entrypoint: contract-cli api call --channel web --profile <profile> --as user --output json <METHOD> <open_web_path>
      identity: USER
      environment: test
      version: 2.0.0-test
      configuration_evidence: 2026-09-23同一test user已验证目录、合同详情、流程记录及CLM_OPENAPI原始人员任务查询，自动发现参与索引漏项
      runtime_status: RUNTIME_VERIFIED
      verified_recipes:
      - efficiency_contracts
      - contract_info
      - process_records
      - employee_lookup
      - department_lookup
      - department_members
      - participant_contracts
      - contract_brief_info
      - raw_person_tasks
      - historical_node_people
      - historical_process_instance
      - historical_form_definition
      verification_scope: 仅记录实际test场景：目录非空及空直属成员、参与合同多页、详情与流程记录非空、原始人员任务自动发现参与索引漏项，以及历史人员/实例/表单联合核验固定单人节点和多人对照。其他发现边界、目录多页和其他租户未实测；assembly_info、employees配方仍未验证。时区头对比仅contract_info/process_records
    mcp:
      status: UNVERIFIED
      identity: USER
      environment: test
      runtime_status: UNVERIFIED
      required_tool: call-open-web-api
      verified_recipes: []
      note: 当前生成环境未发现符合 universal_open_web_call 统一契约的 MCP Tool；业务专用 MCP Tool 不替代该能力。
  constraints:
    default_profile: contract-test
    authenticated_context_only: true
    credential_inputs_forbidden: true
    timezone_header: 'Timezone-Offset: -480'
    timezone: Asia/Shanghai
    timezone_header_runtime_passthrough_verified: true
    timezone_header_runtime_verified_recipes:
    - contract_info
    - process_records
    retry: 429/503有界退避；110004停止对应业务。仅contract_info的110002允许一次contract_brief_info恢复；其他失败保留覆盖缺口，不替换为零或切换身份
  execution_mode: HYBRID
  target_environment: test
  required_capability: universal_open_web_call
  channel_policy:
    preference:
    - cli
    - mcp
    when_none_available: GUIDE_INSTALL_CLI
    resume_original_request: true
inputs:
  profile:
    type: string
    default: contract-test
  start:
    type: datetime
    required: true
    semantics: 任务完成时间下界（含），显式时区
  end:
    type: datetime
    required: true
    semantics: 任务完成时间上界（不含），显式时区
  businesses:
    type: array
    required: false
    item: 真实 businessId + businessTypeCode，或明确普通合同/合同组 ID；以详情验证类型
  discovery_start:
    type: datetime
    required: false
    semantics: 用户明确的效率看板盖章日期样本窗口下界，区别于任务完成时间
  discovery_end:
    type: datetime
    required: false
    semantics: 用户明确的效率看板盖章日期样本窗口上界，区别于任务完成时间
  approver_ids:
    type: array
    required: false
    semantics: 真实员工 ID，分析时本地过滤，不能用姓名猜 ID
  department_ids:
    type: array
    required: false
    semantics: 处理人当前部门 ID，分析时本地过滤；不是发起部门
  node_types:
    type: array
    default:
    - 1
    - 2
    - 3
  max_businesses:
    type: integer
    default: 0
    semantics: 0表示不设数量上限；仅用户显式指定正数时限量。raw-tasks限制本次合并后的候选流程实例数，visible-contracts限制单次可见扫描的业务数，participant-index限制每位人员累计业务数；达到上限标partial并保存续读状态
  page_size:
    type: integer
    default: 100
    semantics: 任务和合同分页大小；不构成总数量上限。原始任务第一页后端默认10，不以短页结束；组织成员仍固定每页50
  max_pages:
    type: integer
    default: 0
    semantics: 0表示不设页数上限；仅用户显式指定正数时限量。raw-tasks按每位人员和任务状态分别计页，visible-contracts按单次可见扫描计页，participant-index按每位人员计合同组页数；可在resume时增大或取消，看板fallback分页状态独立
  trial_max_businesses:
    type: integer
    required: false
    semantics: 仅用户明确要求有限试跑时采用其指定的正数，并标注样本限制；不得默认截取三份业务
  process_definition_ids:
    type: array
    required: false
    semantics: 真实流程定义ID，在每条历史record上做本地过滤；不是合同类型
  process_instances:
    type: array
    required: false
    item: 真实processInstanceId，可附来源businessId；原始任务未返回businessTypeCode时不猜测，按实例权限读取records取得真实类型
  include_subdepartments:
    type: boolean
    default: true
    semantics: 递归所选部门的已发现子部门；直属成员为空仍继续子部门
    cli_mapping: 默认包含子部门；false对应--direct-department-only
  max_member_pages:
    type: integer
    default: 0
    semantics: 0表示不设成员页数上限；仅用户显式指定正数时限制每个部门成员页数，达到上限标注截断
  max_departments:
    type: integer
    default: 0
    semantics: 0表示不设部门数量上限；仅用户显式指定正数时限制递归部门数；始终按内部departmentId去重和防环
  employee_name:
    type: string
    required: false
    semantics: 单个人员姓名关键词，或用户已有来源的内部employeeId字符串；与department_name及resume_file互斥
  department_name:
    type: string
    required: false
    semantics: 单个部门名称关键词；与employee_name及resume_file互斥
  selected_employee_id:
    type: string
    required: false
    semantics: employee_lookup本次候选中的CLM内部employeeId，仅用于同名消歧；不接受openId/userId，不能单独跳过查找
  selected_department_id:
    type: string
    required: false
    semantics: department_lookup本次候选中的CLM内部departmentId，仅用于同名部门消歧；不接受openDepartmentId，不能单独跳过查找
  resume_file:
    type: string
    required: false
    semantics: 同profile、相同candidate-source和窗口的兼容发现状态；旧ES参与索引version不可续读为raw-tasks完整结果；组织缺口需重新解析
  resolve_only:
    type: boolean
    default: false
    semantics: 对应--resolve-only，仅查找并核验人员/部门当前成员；已有明确业务或实例时不扩大合同候选范围
  node_participant_evidence:
    type: array
    required: false
    semantics: bundle中按processInstanceId/processDefinitionId/nodeId绑定的参与人数证据；employee_ids为真实内部人员ID数组，complete=true必须有非空source和可复核的完整历史人数来源。未验证来源不得填complete=true；缺失默认不计个人统计
  analysis_subject:
    type: string
    required: true
    enum:
    - people
    - department
    - other
    semantics: people表示用户明确点名一人或多人；department表示按部门；other表示合同、流程或其他范围。只控制Markdown展示，不改变统计计算或JSON完整结构
  candidate_source:
    type: string
    default: raw-tasks
    enum:
    - raw-tasks
    - visible-contracts
    - participant-index
    semantics: raw-tasks为默认；visible-contracts用于显式合同列表范围；participant-index仅用户指定快速候选且不承诺实际审批完整性
recipes:
  efficiency_contracts:
    purpose: 可选发现效率看板盖章日期窗口中的合同/合同组样本；不提供全量已办任务
    role: OPTIONAL
    required: false
    endpoint:
      family: CLM
      method: POST
      original_page_path: /clm/api/statistic/efficiency/contractDetail
      open_web_path: /open-web/web/clm/statistic/efficiency/contractDetail
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: OBJECT
      content_type: application/json
    parameters:
      Timezone-Offset:
        location: HEADER
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: -480
        type: integer
        meaning: 请求时区偏移分钟数，Asia/Shanghai 固定为 UTC+8 对应 -480
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: NONE
          rules: []
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:StatisticEfficiencyController.java:90; clm-monorepo-fe@1e2ad2a:statistic.ts:107
      pageIndex:
        location: QUERY
        source: DERIVED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: steps.prepare_scope.pagination
        transform: 从 0 开始递增；空页、重复页、上限或唯一业务数达总数停止
        type: integer
        meaning: 从接口约定起始值开始递增的分页页码
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: KNOWN
          rules:
          - 值必须为大于等于 0 的整数
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:StatisticEfficiencyController.java:90; clm-monorepo-fe@1e2ad2a:statistic.ts:107
      pageSize:
        location: QUERY
        source: USER_INPUT
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: REQUEST_SCOPED
        from: inputs.page_size
        type: integer
        meaning: 单页读取数量
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: KNOWN
          rules:
          - 值必须为正整数
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:StatisticEfficiencyController.java:90; clm-monorepo-fe@1e2ad2a:statistic.ts:107
      startDate:
        location: BODY
        source: DERIVED
        required: true
        effectiveness: UNVERIFIED
        stability: REQUEST_SCOPED
        from: inputs.discovery_start
        transform: 经明确披露的看板盖章日期窗口转换为 epoch 毫秒；不得冒充任务完成时间过滤
        type: integer
        meaning: 看板发现窗口开始时间的 epoch 毫秒值
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: KNOWN
          rules:
          - 值必须为非负整数并保留整数精度
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:StatisticEfficiencyController.java:90; clm-monorepo-fe@1e2ad2a:statistic.ts:107
      endDate:
        location: BODY
        source: DERIVED
        required: true
        effectiveness: UNVERIFIED
        stability: REQUEST_SCOPED
        from: inputs.discovery_end
        transform: 经明确披露的看板盖章日期窗口转换为 epoch 毫秒；端点开闭规则待 test 验证
        type: integer
        meaning: 看板发现窗口结束时间的 epoch 毫秒值
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: KNOWN
          rules:
          - 必须大于 startDate；两者均为已披露的看板发现窗口，不替代任务完成时间窗口
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:StatisticEfficiencyController.java:90; clm-monorepo-fe@1e2ad2a:statistic.ts:107
    response:
      success:
        http_status:
        - 200
        predicates:
        - $.success == true
        - $.code == 200
        runtime_status: RUNTIME_VERIFIED
        verified_sample: EMPTY
        note: 两次 test CLI exit_code=0；原始顶层为 success=true、code=200、data，无额外 CLI 包装。仅验证空列表，未验证非空元素或时间字段
      fields:
        items:
          path: $.data.content
          type: array
          nullable: true
        total_count:
          path: $.data.totalElements
          type: integer
          nullable: true
        page_index:
          path: $.data.pageIndex
          type: integer
          nullable: true
        total_pages:
          path: $.data.totalPages
          type: integer
          nullable: true
        business_id:
          path: $.data.content[*].businessId
          type: string
          nullable: true
        business_type:
          path: $.data.content[*].businessTypeCode
          type: integer
          nullable: true
        contract_id:
          path: $.data.content[*].contractId
          type: string
          nullable: true
        assembly_id:
          path: $.data.content[*].contractAssemblyId
          type: string
          nullable: true
        contract_name:
          path: $.data.content[*].contractName
          type: string
          nullable: true
      pagination:
        strategy: CONTENT_AND_UNIQUE_BUSINESS_KEYS
        base_index: 0
        deduplicate_by:
        - businessTypeCode
        - businessId
        has_next_reliable: false
        total_pages_reliable: false
        notes: hasNext 未填；totalPages 整除可多一页；失败/截断/重复页要保留覆盖诊断
    permissions:
      data_scope: 效率看板功能授权及当前用户的个人/部门/全部聚合数据权限
      enforcement: STATISTICS_EFFICIENCY_PAGE_FUNCTION_AUTHORITY；最低 COLLABORATED_ENTERPRISE；StatisticService 追加聚合权限
    execute_when: 没有显式businesses/process_instances，且没有姓名、部门或已核验人员对象；已确定并披露discovery_start/discovery_end的盖章日期样本口径
    failure_handling:
      authorization: 按 references/user-authorization.md 恢复 USER 授权；pending 时等待用户完成，成功后只续办原请求一次。
      permission_denied: 记录对应人员、合同或流程的权限缺口并停止该对象；不切换身份、接口或数据库补数。
      business_failure: 同时检查 HTTP 与业务 success/code；失败保留 partial 诊断，不改写为空集合或零。
      timeout_or_unknown: 只读请求按采集脚本的有界策略重试，仍失败则停止该对象并标记 partial；不无限重试。
  contract_info:
    purpose: 读取普通合同真实业务类型与流程实例，作为记录查询前序
    role: PREREQUISITE
    required: false
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/contract/info
      open_web_path: /open-web/web/clm/contract/info
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters:
      Timezone-Offset:
        location: HEADER
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: -480
        type: integer
        meaning: 请求时区偏移分钟数，Asia/Shanghai 固定为 UTC+8 对应 -480
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: NONE
          rules: []
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:ContractController.java:584
      contractId:
        location: QUERY
        source: PREVIOUS_RESPONSE
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: USER_SCOPED
        hardcode_allowed: false
        from: steps.select_businesses.current.contract_id
        type: string
        meaning: 普通合同业务 ID，按字符串保留长整数精度
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: NONE
          rules: []
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:ContractController.java:584
      tianyancha:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
        type: boolean
        meaning: 是否联查额外企业信息，本统计固定关闭
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: NONE
          rules: []
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:ContractController.java:584
      generateContractName:
        location: QUERY
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: false
        type: boolean
        meaning: 是否执行合同名称生成逻辑，本统计固定关闭
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: NONE
          rules: []
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:ContractController.java:584
    response:
      success:
        http_status:
        - 200
        predicates:
        - $.success == true
        - $.code == 200
        runtime_status: RUNTIME_VERIFIED
        verified_sample: NON_EMPTY
        note: test CLI 核对原始顶层 success=true、code=200、data；132 份业务成功详情中 131 份含 approveRecord，1 份无记录。固定 4 条任务在 -480 与 0 时区头下创建/结束时间均相差 8 小时且耗时一致；无权限与系统错误响应不计入成功
      fields:
        process_instance_id:
          path: $.data.processInstanceId
          type: string
          nullable: true
        process_definition_key:
          path: $.data.processDefinitionKey
          type: string
          nullable: true
        business_type:
          path: $.data.businessTypeCode
          type: integer
          nullable: true
        approve_record:
          path: $.data.approveRecord
          type: object
          nullable: true
    permissions:
      data_scope: 当前登录用户有权读取的业务与流程
      enforcement: Controller 功能权限与 Service 业务读取权限，失败不得解释为零数据
    execute_when: select_businesses.current 已确认为普通合同；未知类型先核对，不把合同组传入此接口
    failure_handling:
      authorization: 按 references/user-authorization.md 恢复 USER 授权；pending 时等待用户完成，成功后只续办原请求一次。
      permission_denied: 记录对应人员、合同或流程的权限缺口并停止该对象；不切换身份、接口或数据库补数。
      business_failure: 同时检查 HTTP 与业务 success/code；失败保留 partial 诊断，不改写为空集合或零。
      timeout_or_unknown: 只读请求按采集脚本的有界策略重试，仍失败则停止该对象并标记 partial；不无限重试。
  assembly_info:
    purpose: 读取合同组真实业务类型与流程实例；不加载子合同
    role: PREREQUISITE
    required: false
    endpoint:
      family: CLM
      method: GET
      original_page_path: /clm/api/contractAssembly/info
      open_web_path: /open-web/web/clm/contractAssembly/info
    operation:
      read_or_write: READ
      identity: USER
      confirmation: NOT_REQUIRED
    request:
      body_mode: NONE
    parameters:
      Timezone-Offset:
        location: HEADER
        source: FIXED
        required: true
        effectiveness: CONFIRMED_EFFECTIVE
        stability: CONTRACT_STABLE
        value: -480
        type: integer
        meaning: 请求时区偏移分钟数，Asia/Shanghai 固定为 UTC+8 对应 -480
        nullable: false
        default:
          mode: NONE
        enum:
          kind: NONE
        constraints:
          status: NONE
          rules: []
        evidence:
        - kind: CODE
          ref: CLM@cd6ecdf:ContractAssemblyController.java:297
      contractAssemblyId:

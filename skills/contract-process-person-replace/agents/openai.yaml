interface:
  display_name: "合同流程节点人员替换"
  short_description: "查找审批、盖章和归档节点并按序号换人，已发布时询问是否再发布"
  default_prompt: "使用 $contract-process-person-replace 查询后台合同流程中直接指定某人员的审批、盖章和归档节点，只列实际匹配节点，按流程分类分组并保留全表序号、完整人员配置和发布状态。用户明确要替换的人员和节点后，仅替换命中人员。选中的版本已发布时，询问仅保存草稿还是保存并发布，已明确同一批次方式时直接沿用。选中的版本未发布时直接保存。按实际保存和发布结果回查。"

interface:
  display_name: "合同流程节点人员替换"
  short_description: "查找配置某人员的审批、盖章和归档节点，按序号批量换人并发布"
  default_prompt: "使用 $contract-process-person-replace 查询后台合同流程中直接指定某人员的审批、盖章和归档节点，只列实际匹配节点，未匹配节点不显示，不评价流程设置或生成流程检查报告。默认按后台流程分类分组，每行显示全表连续唯一序号、流程分类、流程名称、节点、完整人员多选和发布状态；只有本次人员查询确实未成功的范围需要说明。确认旧人、新人及全部或指定序号后，仅替换命中人员，保留其他人员与规则，按实际草稿保存、发布并回查。"
